<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Local — Intendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --paper:#F6F6F3; --surface:#FFFFFF; --sunk:#EFEFEB;
    --ink:#16191A; --muted:#6B716D; --faint:#9AA09B;
    --line:#DEDFDA; --line-strong:#C8CAC4;
    --pine:#285943; --pine-soft:#E4EDE7;
    --signal:#B25B14; --signal-soft:#FAEDE0;
    --alert:#A32E23; --alert-soft:#FAE5E2;
    --shadow:0 1px 2px rgba(20,25,20,.06), 0 4px 14px rgba(20,25,20,.05);
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,sans-serif;
    color-scheme:light dark;
    padding-top:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#131614; --surface:#1C201E; --sunk:#242927;
      --ink:#E9EBE8; --muted:#9BA29D; --faint:#767D78;
      --line:#2E3431; --line-strong:#3E4643;
      --pine:#72C09A; --pine-soft:#1E2E26;
      --signal:#E0913F; --signal-soft:#2E2318;
      --alert:#E0776A; --alert-soft:#301D1A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  img{max-width:100%}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
       border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:10px;padding:10px 16px}
  .brand{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.02em;
         text-transform:uppercase;line-height:1;flex:1;min-width:0}
  .brand span{color:var(--pine)}
  .whoami{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line-strong);
          border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;max-width:60%}
  .whoami b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--pine);flex:none}
  .dot.adm{background:var(--signal)}
  .povbar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--signal-soft);
          border-bottom:1px solid var(--line);font-size:12.5px;color:var(--signal)}

  .wrap{padding:16px;flex:1}
  .eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;
           font-weight:600;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .eyebrow.sp{margin-top:24px}
  .code{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .num{font-variant-numeric:tabular-nums}
  .banner{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
          font-size:13px;color:var(--muted);margin-bottom:16px}
  .banner.err{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}

  .stats{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;
         overflow:hidden;margin-bottom:18px}
  .stat{flex:1;background:var(--surface);padding:11px 12px;min-width:0}
  .stat .v{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1;
           font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.25}
  .stat.out .v{color:var(--signal)} .stat.late .v{color:var(--alert)}

  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
       border:1px solid var(--line);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow)}
  .row:hover{border-color:var(--line-strong)}
  .row-bar{width:3px;align-self:stretch;border-radius:2px;background:var(--line-strong);flex:none}
  .row[data-out="1"] .row-bar{background:var(--signal)}
  .row.zero .row-bar{background:var(--line)}
  .row.off{opacity:.5}
  .row-main{flex:1;min-width:0}
  .row-name{font-family:var(--cond);font-size:18px;font-weight:600;line-height:1.15;display:block}
  .row-sub{font-size:12.5px;color:var(--muted);margin-top:1px;display:block}
  .row-right{text-align:right;flex:none}
  .row-count{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .row-out{font-size:11.5px;color:var(--signal);font-weight:600;margin-top:1px}
  .chev{color:var(--faint);flex:none;font-size:18px}
  .row.zero .row-count{color:var(--faint);font-weight:400}
  .row.feature{background:var(--pine-soft);border-color:var(--pine)}
  .row.feature .row-bar{background:var(--pine)}

  .tag{display:inline-block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;
       font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--pine-soft);
       color:var(--pine);vertical-align:1px}
  .tag.sh{background:var(--signal-soft);color:var(--signal)}
  .tag.lk{background:var(--alert-soft);color:var(--alert)}

  /* ---------- blocs objets ---------- */
  .blocks{display:flex;flex-direction:column;gap:8px}
  .blk{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);
       border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
  .blk.out{border-color:var(--signal)}
  .blk.gone{opacity:.55}
  .blk-body{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 12px;text-align:left}
  .blk-txt{flex:1;min-width:0}
  .blk-name{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .blk-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
  .blk-qty{flex:none;text-align:right;min-width:62px}
  .blk-qty .n{font-family:var(--cond);font-size:22px;font-weight:700;line-height:1;
              font-variant-numeric:tabular-nums}
  .blk-qty .n.part{color:var(--signal)}
  .blk-qty .loc{font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.2;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:96px;margin-left:auto}
  .blk-dots{flex:none;width:40px;border-left:1px solid var(--line);display:grid;place-items:center;
            font-size:18px;color:var(--muted);letter-spacing:1px}
  .blk-dots:hover{background:var(--sunk);color:var(--ink)}
  .blk-thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;flex:none;background:var(--sunk)}

  .pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;
        font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em}
  .pill.out{background:var(--signal-soft);color:var(--signal)}
  .pill.late,.pill.exp{background:var(--alert-soft);color:var(--alert)}
  .pill.soon{background:var(--signal-soft);color:var(--signal)}
  .pill.lend{background:var(--pine-soft);color:var(--pine)}

  /* ---------- compteur +/- ---------- */
  .step{display:flex;align-items:center;gap:0;flex:none;border:1px solid var(--line-strong);
        border-radius:999px;overflow:hidden;background:var(--surface)}
  .step button{width:38px;height:38px;display:grid;place-items:center;font-size:19px;color:var(--muted)}
  .step button:hover{background:var(--sunk);color:var(--ink)}
  .step .v{min-width:30px;text-align:center;font-family:var(--mono);font-size:14px;font-weight:600;
           font-variant-numeric:tabular-nums}
  .step.on{border-color:var(--pine);background:var(--pine-soft)}
  .step.on .v{color:var(--pine)}
  .blk.picked{border-color:var(--pine);background:var(--pine-soft)}
  .addbtn{flex:none;padding:0 16px;border-left:1px solid var(--line);font-family:var(--cond);
          font-size:15px;font-weight:600;text-transform:uppercase;color:var(--pine)}
  .addbtn:hover{background:var(--pine-soft)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;
       border-radius:9px;font-family:var(--cond);font-size:16px;font-weight:600;letter-spacing:.03em;
       text-transform:uppercase;line-height:1}
  .btn.primary{background:var(--pine);color:#fff}
  .btn.danger{background:var(--alert);color:#fff}
  .btn.ghost{border:1px solid var(--line-strong)}
  .btn.sm{padding:8px 12px;font-size:13.5px}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .actionbar{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
             padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
             display:flex;gap:9px;flex-wrap:wrap}
  .actionbar .btn{flex:1;min-width:120px}
  .actionbar .hint{width:100%;font-size:12px;color:var(--muted);margin:-3px 0 2px}

  .tabs{position:sticky;bottom:0;z-index:18;display:flex;background:var(--surface);
        border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
       font-family:var(--cond);font-size:11.5px;font-weight:600;text-transform:uppercase;
       letter-spacing:.04em;color:var(--faint);position:relative}
  .tab[aria-selected="true"]{color:var(--pine)}
  .tab .ic{font-size:17px;line-height:1}
  .tab .badge{position:absolute;top:4px;left:50%;margin-left:5px;background:var(--signal);color:#fff;
              font-family:var(--mono);font-size:9.5px;padding:0 4px;border-radius:999px}

  .search{display:flex;align-items:center;gap:9px;background:var(--surface);
          border:1px solid var(--line-strong);border-radius:9px;padding:0 12px;margin-bottom:14px}
  .search input{flex:1;border:none;background:none;padding:12px 0;outline:none;font-size:16px}

  .crumb{display:flex;align-items:flex-start;gap:11px;margin-bottom:14px}
  .back{font-size:22px;color:var(--muted);padding:2px 4px;margin-left:-4px;flex:none}
  .crumb h2{font-family:var(--cond);font-size:23px;font-weight:700;line-height:1.1;margin:0;
            text-wrap:balance}
  .crumb p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

  .seg{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;
       overflow:hidden;margin-bottom:12px}
  .seg button{flex:1;background:var(--surface);padding:7px 6px;font-size:12.5px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--pine);color:#fff;font-weight:600}

  .scrim{position:fixed;inset:0;z-index:40;background:rgba(15,20,17,.45);display:flex;
         align-items:flex-end;justify-content:center}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px;
         padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;
         border:1px solid var(--line);border-bottom:none}
  .sheet h3{font-family:var(--cond);font-size:21px;font-weight:700;margin:0 0 3px}
  .sheet .lede{font-size:13px;color:var(--muted);margin:0 0 15px}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;
               font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line-strong);
    border-radius:8px;background:var(--surface);font-size:16px;outline:none}
  .field .hint{font-size:12px;color:var(--faint);margin-top:5px}
  .two{display:flex;gap:10px}.two>*{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:8px 13px;border:1px solid var(--line-strong);border-radius:999px;font-size:13.5px}
  .chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
  .check{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;
         border:1px solid var(--line-strong);border-radius:8px;margin-bottom:14px;font-size:14.5px}
  .check .bx{width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:6px;flex:none;
             display:grid;place-items:center;font-size:13px;color:transparent}
  .check[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft)}
  .check[aria-pressed="true"] .bx{background:var(--pine);border-color:var(--pine);color:#fff}
  .check small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .recap{background:var(--sunk);border-radius:8px;padding:10px 12px;margin-bottom:15px;font-size:13px;
         max-height:210px;overflow:auto}
  .recap .ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;align-items:center}
  .recap input{width:64px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:6px;
               background:var(--surface);font-family:var(--mono);text-align:right;font-size:14px}
  .menu{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
        border-radius:10px;overflow:hidden}
  .menu button{background:var(--surface);padding:13px 14px;text-align:left;display:flex;
               align-items:center;gap:11px;font-size:15px}
  .menu button:hover{background:var(--sunk)}
  .menu button .mi{width:20px;text-align:center;color:var(--muted);flex:none}
  .menu button.dgr{color:var(--alert)}
  .menu button .msub{display:block;font-size:12px;color:var(--faint);margin-top:1px}

  .empty{text-align:center;padding:34px 20px;color:var(--muted)}
  .empty .big{font-family:var(--cond);font-size:19px;font-weight:600;color:var(--ink);margin-bottom:5px}
  .note{font-size:12.5px;color:var(--faint);margin-top:16px;line-height:1.45}
  .spin{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--cond);
        text-transform:uppercase;letter-spacing:.08em;font-size:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;background:var(--ink);
         color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;
         box-shadow:var(--shadow);max-width:90%}
  .bigphoto{width:100%;border-radius:10px;margin-bottom:14px;background:var(--sunk)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-in">
      <div class="brand">Le <span>Local</span></div>
      <button class="whoami" id="whoBtn"><span class="dot" id="whoDot"></span><b id="whoName">…</b></button>
    </div>
    <div id="povbar"></div>
  </header>
  <main class="wrap" id="main"><div class="spin">Chargement…</div></main>
  <div id="actions"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ======================= configuration ======================= */
const ROOT = "https://raspy-sound-6175.rawadyaman7.workers.dev";
const API  = ROOT + "/api";
const RETARD = 21;      // jours dehors avant alerte rouge
const EXP_SOON = 30;    // jours avant péremption = alerte orange
const PHOTO_MAX = 1200; // côté le plus long, en pixels, après réduction

/* ======================= aides ======================= */
const $ = id => document.getElementById(id);
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const days = iso => Math.floor((Date.now()-new Date(iso).getTime())/86400000);
const daysTo = iso => Math.ceil((new Date(iso).getTime()-Date.now())/86400000);
const first = v => Array.isArray(v) ? v[0] : v;
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
const today = () => new Date().toISOString().slice(0,10);
const top0 = () => window.scrollTo(0,0);
let toastT;
function toast(msg){
  $("toast").innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(()=>$("toast").innerHTML="", 3000);
}

/* ======================= Airtable via le Worker ======================= */
async function apiGet(table){
  const out = []; let offset = null;
  do{
    const u = new URL(API + "/" + table);
    u.searchParams.set("pageSize","100");
    if(offset) u.searchParams.set("offset", offset);
    const r = await fetch(u);
    if(!r.ok) throw new Error(table + " : " + r.status);
    const j = await r.json();
    out.push(...(j.records||[]));
    offset = j.offset || null;
  } while(offset);
  return out;
}
async function apiPost(table, records){
  const out = [];
  for(let i=0;i<records.length;i+=10){
    const r = await fetch(API + "/" + table, { method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({records: records.slice(i,i+10), typecast:true}) });
    if(!r.ok) throw new Error(await r.text());
    out.push(...(await r.json()).records);
  }
  return out;
}
async function apiPatch(table, records){
  const out = [];
  for(let i=0;i<records.length;i+=10){
    const r = await fetch(API + "/" + table, { method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({records: records.slice(i,i+10), typecast:true}) });
    if(!r.ok) throw new Error(await r.text());
    out.push(...(await r.json()).records);
  }
  return out;
}
/* le Worker n'autorise DELETE que sur les lignes de préparation */
async function apiDelete(table, ids){
  for(const id of ids){
    const r = await fetch(API + "/" + table + "/" + id, { method:"DELETE" });
    if(!r.ok) throw new Error(await r.text());
  }
}
async function apiAuth(code){
  const r = await fetch(ROOT + "/auth", { method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({code}) });
  if(!r.ok) throw new Error("Vérification impossible");
  return r.json();
}
async function apiUpload(table, recordId, dataUrl, filename){
  const m = /^data:(image\/[a-z]+);base64,(.*)$/.exec(dataUrl);
  if(!m) throw new Error("Image illisible");
  const r = await fetch(ROOT + "/upload", { method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({table, recordId, contentType:m[1], file:m[2], filename}) });
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "Envoi refusé");
  return r.json();
}
/* réduit la photo dans le navigateur : un téléphone produit 5 Mo, on envoie ~250 Ko */
function shrink(file){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      const k = Math.min(1, PHOTO_MAX/Math.max(w,h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Image illisible")); };
    img.src = url;
  });
}

/* ======================= état ======================= */
const DB = { unites:[], cats:[], objets:[], conso:[], personnes:[], mvts:[], lieux:[], sorties:[], lignes:[] };
const IX = { unite:{}, cat:{}, objet:{}, personne:{}, lieu:{}, sortie:{} };
const S = {
  tab:"home", ctx:null, cat:null, lieu:null, sortie:null, adm:"lieux", emp:"autres",
  pick:null, bag:{}, q:"", me:null, pov:null, interval:25,
  loading:true, error:null
};
const LS = "local-intendance-v3";
try{ const r = localStorage.getItem(LS); if(r) S.me = JSON.parse(r); }catch(e){}
try{ const i = localStorage.getItem(LS+"-int"); if(i) S.interval = +i; }catch(e){}

const isAdmin = () => !!S.me && S.me.role === "intendant" && !S.pov;
const uName = id => (IX.unite[id] && IX.unite[id].f["Nom"]) || "—";
const kids  = id => DB.unites.filter(u => first(u.f["Unité parente"]) === id && u.f["Actif"]);
const roots = () => DB.unites.filter(u => !u.f["Unité parente"] && u.f["Actif"]);
function subtree(id){ const o=[id]; for(const k of kids(id)) o.push(...subtree(k.id)); return o; }
function scopeIds(){ return S.pov ? subtree(S.pov) : DB.unites.map(u=>u.id); }
const inScope = r => arr(r.f["Unité"]).some(u => scopeIds().includes(u));
/* l'unité à laquelle l'utilisateur appartient, quelle que soit la vue */
const myScope = () => S.me ? subtree(S.me.unite) : [];

function catsFor(unitId, parentId){
  return DB.cats.filter(c=>{
    if(!c.f["Active"]) return false;
    if((first(c.f["Catégorie parente"])||null) !== (parentId||null)) return false;
    const us = arr(c.f["Unités"]);
    return us.length === 0 || us.includes(unitId);
  }).sort((a,b)=>(a.f["Ordre"]||99)-(b.f["Ordre"]||99));
}
function catOf(rec){
  const id = first(rec.f["Catégorie"]);
  if(id && IX.cat[id]) return IX.cat[id];
  const t = rec.f["Catégorie (texte, remplacé)"];
  return t ? DB.cats.find(c=>c.f["Nom"]===t) || null : null;
}
/* l'emplacement vient du lien ; sinon on retombe sur l'ancien texte */
function lieuOf(rec){
  const id = first(rec.f["Emplacement"]) || first(rec.f["Emplacement (lien)"]);
  if(id && IX.lieu[id]) return IX.lieu[id];
  const t = rec.f["Emplacement habituel"] || rec.f["Emplacement"];
  if(typeof t === "string" && t){
    const n = norm(t).replace(/^local\s*[—-]\s*/,"");
    return DB.lieux.find(l => norm(l.f["Nom"]) === n) || null;
  }
  return null;
}
const isShared = c => !!(c && c.f["Partagée"]);
const isLocked = c => !!(c && c.f["Verrouillée"]);
const canEdit  = c => isAdmin() || !isLocked(c);
const tableOf  = r => DB.conso.some(x=>x.id===r.id) ? "consommables" : "objets";
const lieuField = r => tableOf(r)==="consommables" ? "Emplacement (lien)" : "Emplacement";
const isMine = r => arr(r.f["Unité"]).some(u => myScope().includes(u));

function linesOf(unitId, catId){
  const out = [];
  const take = (rec)=>{
    if(rec.f["Archivé"]) return;
    const c = catOf(rec); if(!c || c.id !== catId) return;
    const us = arr(rec.f["Unité"]);
    if(isShared(c)){ if(us.length && !us.includes(unitId)) return; }
    else if(!us.includes(unitId)) return;
    out.push(rec);
  };
  DB.objets.forEach(take); DB.conso.forEach(take);
  return out;
}

/* quantités actuellement dehors, calculées depuis le journal */
let OUTQ = {}, OPEN = {};
function recompute(){
  const m = {};
  for(const mv of DB.mvts){
    const oid = first(mv.f["Objet"]); if(!oid) continue;
    const q = mv.f["Quantité"] || 1, t = mv.f["Type"];
    if(t === "Sortie") m[oid] = (m[oid]||0) + q;
    else if(t === "Retour" || t === "Perte déclarée" || t === "Casse déclarée")
      m[oid] = (m[oid]||0) - q;
  }
  for(const k in m) if(m[k] <= 0) delete m[k];
  OUTQ = m;
  const open = {};
  for(const mv of DB.mvts){
    if(mv.f["Type"] !== "Sortie") continue;
    const oid = first(mv.f["Objet"]); if(!oid || !OUTQ[oid]) continue;
    const cur = open[oid];
    if(!cur || (mv.f["Date"]||"") > (cur.f["Date"]||"")) open[oid] = mv;
  }
  OPEN = open;
}
const dispoOf = r => Math.max(0, (r.f["Quantité"] ?? 0) - (OUTQ[r.id]||0));

/* ======================= chargement ======================= */
async function load(){
  S.loading = true; S.error = null; render();
  try{
    const res = await Promise.all([
      apiGet("unites"), apiGet("categories"), apiGet("objets"), apiGet("consommables"),
      apiGet("personnes"), apiGet("mouvements"), apiGet("emplacements"), apiGet("sorties"),
      apiGet("lignes")
    ]);
    const map = r => ({ id:r.id, f:r.fields||{} });
    DB.unites=res[0].map(map); DB.cats=res[1].map(map); DB.objets=res[2].map(map);
    DB.conso=res[3].map(map); DB.personnes=res[4].map(map); DB.mvts=res[5].map(map);
    DB.lieux=res[6].map(map); DB.sorties=res[7].map(map); DB.lignes=res[8].map(map);
    IX.unite={}; DB.unites.forEach(u=>IX.unite[u.id]=u);
    IX.cat={};   DB.cats.forEach(c=>IX.cat[c.id]=c);
    IX.objet={}; DB.objets.forEach(o=>IX.objet[o.id]=o); DB.conso.forEach(o=>IX.objet[o.id]=o);
    IX.personne={}; DB.personnes.forEach(p=>IX.personne[p.id]=p);
    IX.lieu={};  DB.lieux.forEach(l=>IX.lieu[l.id]=l);
    IX.sortie={};DB.sorties.forEach(s=>IX.sortie[s.id]=s);
    recompute();
    if(S.me && S.me.role === "gerant" && !S.pov) S.pov = S.me.unite;
    if(S.pov && !S.ctx) S.ctx = S.pov;
    S.loading = false;
  }catch(e){ S.loading = false; S.error = e.message || String(e); }
  render();
}

function wireTabs(){

function countsFor(unitId){
  let total=0, out=0;
  const ids = subtree(unitId);
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"]) continue;
    if(!arr(r.f["Unité"]).some(u=>ids.includes(u))) continue;
    total++; if(OUTQ[r.id]) out++;
  }
  return {total, out};
}

function catRow(cat, unitId){
  const subs = catsFor(unitId, cat.id);
  let lines = linesOf(unitId, cat.id);
  let n = lines.length, out = lines.filter(r=>OUTQ[r.id]).length;
  for(const s of subs){ const ls = linesOf(unitId, s.id); n += ls.length; out += ls.filter(r=>OUTQ[r.id]).length; }
  const badges = [isShared(cat)?`<span class="tag sh">partagé</span>`:"",
                  isLocked(cat)?`<span class="tag lk">verrouillé</span>`:""].filter(Boolean).join(" ");
  return `<button class="row ${n?"":"zero"}" data-cat="${cat.id}" data-out="${out?1:0}">
    <span class="row-bar"></span>
    <span class="row-main"><span class="row-name">${esc(cat.f["Nom"])}</span>
      <span class="row-sub">${subs.length?`${subs.length} sous-section${subs.length>1?"s":""}${badges?" · ":""}`:""}${badges}</span></span>
    <span class="row-right"><div class="row-count num">${n}</div>
      ${out?`<div class="row-out num">${out} dehors</div>`:""}</span>
    <span class="chev">›</span></button>`;
}

const bucket = (v, step) => { const lo = Math.floor(v/step)*step; return lo + "–" + (lo+step); };

function renderCat(){
  const cat = IX.cat[S.cat], u = IX.unite[S.ctx];
  if(!cat || !u){ S.cat=null; return render(); }
  const subs = catsFor(u.id, cat.id), lines = linesOf(u.id, cat.id);
  const mesure = cat.f["Mesure"] || "Aucune";
  const measured = /Longueur|Diam|Volume/.test(mesure);
  const editable = canEdit(cat);
  let body = "";
  if(subs.length) body += `<div class="eyebrow">Sous-sections</div>
    <div class="rows">${subs.map(s=>catRow(s,u.id)).join("")}</div>`;
  if(lines.length || !subs.length){
    if(subs.length) body += `<div class="eyebrow sp">Directement ici</div>`;
    if(measured) body += `<div class="seg" id="seg">
      <button data-step="10" aria-pressed="${S.interval===10}">par 10 cm</button>
      <button data-step="25" aria-pressed="${S.interval===25}">par 25 cm</button>
      <button data-step="0" aria-pressed="${S.interval===0}">tout détailler</button></div>`;
    body += lines.length ? renderLines(lines, mesure, measured)
      : `<div class="empty"><div class="big">Rien ici</div>${editable
          ? "Ajoute la première ligne avec le bouton en bas."
          : "Catégorie verrouillée — demande à l'intendant."}</div>`;
  }
  $("main").innerHTML = `
    <div class="crumb"><button class="back" id="back">‹</button>
      <div><h2>${esc(cat.f["Nom"])}</h2>
        <p>${esc(u.f["Nom"])} · ${lines.length} ligne${lines.length>1?"s":""}
        ${isShared(cat)?" · <span class='tag sh'>stock partagé</span>":""}
        ${isLocked(cat)&&!isAdmin()?" · <span class='tag lk'>lecture seule</span>":""}</p></div></div>${body}
    ${isShared(cat)?`<p class="note">Stock commun : ce que ton unité prend, l'autre le voit manquer.</p>`:""}`;
  $("back").onclick = ()=>{ S.cat = first(cat.f["Catégorie parente"]) || null; render(); top0(); };
  const seg = $("seg");
  if(seg) seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.interval = +b.dataset.step;
    try{ localStorage.setItem(LS+"-int", S.interval); }catch(e){}
    render(); });
  wireCat(); wireBlocks();
  $("actions").innerHTML = `<div class="actionbar">
    ${editable?`<button class="btn primary" id="add">+ Ajouter une ligne</button>`:""}
    ${canEdit(cat)?`<button class="btn ghost" id="edcat">Modifier la catégorie</button>`:""}
  </div>`;
  const a=$("add"); if(a) a.onclick = ()=> sheetItem(null, cat);
  const e=$("edcat"); if(e) e.onclick = ()=> sheetCat(cat, u.id, first(cat.f["Catégorie parente"])||null);
}

function renderLines(lines, mesure, measured){
  const key = /Volume/.test(mesure) ? "Volume (L)" : "Longueur (cm)";
  const unit = /Volume/.test(mesure) ? " L" : " cm";
  if(measured && S.interval > 0){
    const g = {};
    for(const r of lines){
      const v = r.f[key];
      const k = (v==null) ? "sans mesure" : bucket(v, S.interval) + unit;
      (g[k] ||= []).push(r);
    }
    return Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0],"fr",{numeric:true}))
      .map(([k,rs])=>{
        const tot = rs.reduce((s,r)=>s+(r.f["Quantité"]||0),0);
        const out = rs.reduce((s,r)=>s+(OUTQ[r.id]||0),0);
        return `<div class="eyebrow sp">${esc(k)} — ${tot} pièce${tot>1?"s":""}${out?` · ${out} dehors`:""}</div>
                <div class="blocks">${rs.map(r=>blk(r)).join("")}</div>`;
      }).join("");
  }
  return `<div class="blocks">${lines.map(r=>blk(r)).join("")}</div>`;
}

/* ---------- le bloc objet ---------- */
function blk(r, opts){
  opts = opts || {};
  const f = r.f, out = OUTQ[r.id]||0, q = f["Quantité"] ?? null;
  const dispo = q!=null ? Math.max(0, q-out) : null;
  const lieu = lieuOf(r);
  const mv = OPEN[r.id];
  const photo = arr(f["Photo"])[0];
  const det = [f["Taille / détail"], f["Longueur (cm)"]!=null?f["Longueur (cm)"]+" cm":null,
               f["Volume (L)"]!=null?f["Volume (L)"]+" L":null, f["Usage"]].filter(Boolean).join(" · ");
  let pills = "";
  if(out){ const d = mv?days(mv.f["Date"]):0;
    pills += `<span class="pill ${d>=RETARD?"late":"out"}">${out} dehors${d?` · ${d}j`:""}</span>`; }
  const exp = f["Date d'expiration"];
  if(exp){ const dd = daysTo(exp);
    pills += dd<0 ? `<span class="pill exp">périmé</span>`
          : dd<=EXP_SOON ? `<span class="pill soon">expire dans ${dd}j</span>` : ""; }
  if(f["État"]==="Perdu") pills += `<span class="pill exp">perdu</span>`;
  if(opts.showLend && f["Prêtable"]) pills += `<span class="pill lend">prêtable</span>`;
  const owner = arr(f["Unité"]).map(uName).filter(Boolean)[0];
  const foreign = opts.showUnit && owner;

  const right = opts.stepper
    ? `<div class="step ${S.bag[r.id]?"on":""}" data-stp="${r.id}">
         <button data-minus="${r.id}" aria-label="moins">−</button>
         <span class="v" id="bag-${r.id}">${S.bag[r.id]||0}</span>
         <button data-plus="${r.id}" aria-label="plus">+</button></div>`
    : `<div class="blk-qty">
         <div class="n ${out?"part":""}">${dispo!=null?dispo:"—"}</div>
         <div class="loc">${esc(lieu?lieu.f["Nom"]:"sans emplacement")}</div></div>`;

  return `<div class="blk ${out?"out":""} ${f["État"]==="Perdu"?"gone":""} ${opts.stepper&&S.bag[r.id]?"picked":""}" data-blk="${r.id}">
    <div class="blk-body" ${opts.stepper?`data-plus="${r.id}"`:`data-open="${r.id}"`}>
      ${photo?`<img class="blk-thumb" src="${esc(photo.thumbnails&&photo.thumbnails.small?photo.thumbnails.small.url:photo.url)}" alt="">`:""}
      <div class="blk-txt">
        <div class="blk-name">${esc(f["Nom"]||f["Code"]||"—")}</div>
        <div class="blk-meta">${det?`<span class="code">${esc(det)}</span>`:""}
          ${foreign?`<span class="tag">${esc(owner)}</span>`:""}${pills}
          ${opts.stepper?`<span class="code">${dispo} dispo${lieu?" · "+esc(lieu.f["Nom"]):""}</span>`:""}</div>
      </div>
    </div>
    ${right}
    ${opts.stepper?"":opts.borrow
      ? `<button class="addbtn" data-borrow="${r.id}">Prendre</button>`
      : `<button class="blk-dots" data-dots="${r.id}" aria-label="Options">···</button>`}
  </div>`;
}

function lieuCounts(scoped){
  const counts = {};
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"]) continue;
    if(scoped !== false && !inScope(r)) continue;
    const l = lieuOf(r); const k = l?l.id:"_";
    counts[k] = (counts[k]||0)+1;
  }
  return counts;
}

function renderLieu(){
  const l = IX.lieu[S.lieu]; if(!l){ S.lieu=null; return render(); }
  const items = [];
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"] || !inScope(r)) continue;
    const x = lieuOf(r); if(x && x.id === l.id) items.push(r);
  }
  const photo = arr(l.f["Photo"])[0];
  $("main").innerHTML = `
    <div class="crumb"><button class="back" id="back">‹</button>
      <div><h2>${esc(l.f["Nom"])}</h2>
        <p>${esc(l.f["Type"]||"")} · ${items.length} ligne${items.length>1?"s":""}</p></div></div>
    ${photo?`<img class="bigphoto" src="${esc(photo.url)}" alt="">`:""}
    ${l.f["Description"]?`<div class="banner">${esc(l.f["Description"])}</div>`:""}

/* ======================= sorties ======================= */
const lignesOf = sid => DB.lignes.filter(l=>first(l.f["Sortie"])===sid);
function mvtsOfSortie(sid){ return DB.mvts.filter(m=>first(m.f["Sortie"])===sid); }
function sortieState(sid){
  const pris = {}, rendus = {};
  for(const m of mvtsOfSortie(sid)){
    const oid = first(m.f["Objet"]); if(!oid) continue;
    const q = m.f["Quantité"]||1;
    if(m.f["Type"]==="Sortie") pris[oid]=(pris[oid]||0)+q;
    else rendus[oid]=(rendus[oid]||0)+q;
  }
  let dehors = 0;
  for(const k in pris) dehors += Math.max(0, pris[k]-(rendus[k]||0));
  const prevu = lignesOf(sid).reduce((s,l)=>s+(l.f["Quantité prévue"]||1),0);
  return {pris, rendus, dehors, prevu, nItems:Object.keys(pris).length};
}

function renderSorties(outIds){

    <button class="btn primary wide" id="newsortie">+ Nouvelle sortie</button></div>`;

    const us = arr(s.f["Unité"]);

  const actives = mine.filter(s=>s.f["Statut"]!=="Terminée")
    .sort((a,b)=>(b.f["Départ"]||"").localeCompare(a.f["Départ"]||""));
  const done = mine.filter(s=>s.f["Statut"]==="Terminée")

    ${!actives.length && !sansSortie.length?`<div class="empty"><div class="big">Rien n'est sorti</div>

    ${done.length?`<div class="eyebrow sp">Terminées</div>

function sortieRow(s){
  const st = sortieState(s.id);
  const d = s.f["Départ"] ? new Date(s.f["Départ"]).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}) : "";
  const sub = st.dehors ? `${st.dehors} dehors`
            : st.prevu  ? `${st.prevu} à emporter`
            : s.f["Statut"]==="Terminée" ? "terminée" : "vide";
  return `<button class="row" data-sortie="${s.id}" data-out="${st.dehors?1:0}">

      <span class="row-sub">${esc(s.f["Type"]||"")}${d?" · "+d:""} · ${esc(sub)}</span></span>

}

async function bumpLigne(lid, d){
  const l = DB.lignes.find(x=>x.id===lid); if(!l) return;
  const q = Math.max(1, (l.f["Quantité prévue"]||1) + d);
  l.f["Quantité prévue"] = q; render();
  try{ await apiPatch("lignes",[{id:lid, fields:{"Quantité prévue":q}}]); }
  catch(e){ toast("Échec — la quantité n'est pas enregistrée"); await load(); }
}
async function delLigne(lid){
  DB.lignes = DB.lignes.filter(x=>x.id!==lid); render();
  try{ await apiDelete("lignes",[lid]); }
  catch(e){ toast("Échec du retrait"); await load(); }
}

/* le départ : c'est ici, et seulement ici, que le matériel quitte l'inventaire */
async function departir(s, lg){
  const prend = [], manque = [];
  for(const l of lg){
    const id = first(l.f["Objet"]), r = IX.objet[id]; if(!r) continue;
    const want = l.f["Quantité prévue"]||1, dispo = dispoOf(r);
    const q = Math.min(want, dispo);
    if(q < want) manque.push(`${r.f["Nom"]} : ${q}/${want}`);
    if(q > 0) prend.push({id, q});
  }
  if(!prend.length){ toast("Rien de disponible dans cette liste"); return; }
  openSheet(`<h3>On part ?</h3>
    <p class="lede">${prend.length} ligne${prend.length>1?"s":""} vont sortir de l'inventaire.
      La liste de préparation se vide et tout passe en « dehors ».</p>
    ${manque.length?`<div class="banner err"><b>Pas tout est disponible.</b><br>
      ${manque.map(esc).join("<br>")}<br>On emporte ce qu'il y a.</div>`:""}
    <div class="field"><label for="chez">Où ça part</label>
      <input id="chez" type="text" value="${esc(s.f["Lieu"]||"")}" placeholder="Qornayel, chez Jad…"></div>
    <div class="field"><label for="due">Retour prévu</label>
      <input id="due" type="date" value="${esc(s.f["Retour prévu"]||"")}"></div>
    <button class="btn primary wide" id="ok">Oui, on emporte</button>`);
  $("ok").onclick = async ()=>{
    const chez = $("chez").value.trim(), due = $("due").value;
    closeSheet(); toast("Enregistrement…");
    try{
      await apiPost("mouvements", prend.map(x=>{
        const owner = arr(IX.objet[x.id].f["Unité"]);
        const emprunt = owner.length && !owner.some(u=>myScope().includes(u));
        return { fields:{ Type:"Sortie", Date:new Date().toISOString(), "Quantité":x.q,
          Objet:[x.id], Sortie:[s.id], "Unité emprunteuse":[S.me.unite],
          ...(S.me.pid?{Personne:[S.me.pid]}:{}),
          ...(due?{"Retour prévu":due}:{}), ...(chez?{"Chez qui":chez}:{}),
          ...(emprunt?{"Statut emprunt":"Sans réponse"}:{}) } };
      }));
      await apiDelete("lignes", lg.map(l=>l.id));
      await apiPatch("sorties",[{id:s.id, fields:{Statut:"En cours"}}]);
      toast("C'est parti"); await load();
    }catch(e){ toast("Échec : " + (e.message||"")); await load(); }
  };
}

/* ---------- choisir le matériel : panier local, une seule écriture ---------- */
function bagTotal(){ return Object.values(S.bag).reduce((a,b)=>a+b,0); }
function pickerPool(){
  const q = norm(S.q), pool = [];
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"] || !inScope(r)) continue;
    if(dispoOf(r) <= 0 && !S.bag[r.id]) continue;
    if(q && !(norm(r.f["Nom"]).includes(q) || norm(r.f["Code"]).includes(q)
              || norm((catOf(r)||{f:{}}).f["Nom"]).includes(q))) continue;
    pool.push(r);
  }
  return pool;
}
function pickerList(){
  const pool = pickerPool();
  if(!pool.length) return `<div class="empty"><div class="big">Rien à afficher</div>
    Tout est déjà sorti, ou le filtre est trop strict.</div>`;
  const byCat = {};
  for(const r of pool){ const c = catOf(r); (byCat[c?c.f["Nom"]:"Sans catégorie"] ||= []).push(r); }
  return Object.entries(byCat).sort((a,b)=>a[0].localeCompare(b[0],"fr"))
    .map(([k,rs])=>`<div class="eyebrow sp">${esc(k)}</div>
      <div class="blocks">${rs.map(r=>blk(r,{stepper:true})).join("")}</div>`).join("");
}
function renderPicker(){
  const s = IX.sortie[S.pick.sortie];
  $("main").innerHTML = `
    <div class="crumb"><button class="back" id="back">‹</button>
      <div><h2>Qu'est-ce qu'on emporte ?</h2>
        <p>${esc(s?s.f["Nom"]:"")} — touche une ligne pour l'ajouter</p></div></div>
    <div class="search"><span style="color:var(--faint);font-size:17px">⌕</span>
      <input id="q" type="search" placeholder="tanjara, corde, lampe…" value="${esc(S.q)}"
             autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div id="plist">${pickerList()}</div>`;
  $("back").onclick = ()=>{ S.pick=null; S.bag={}; S.q=""; render(); top0(); };
  const inp = $("q");
  inp.oninput = ()=>{ S.q = inp.value; $("plist").innerHTML = pickerList(); wirePicker(); };
  wirePicker(); paintBag();
}
function wirePicker(){
  document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); bump(b.dataset.plus, 1); });
  document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); bump(b.dataset.minus, -1); });
}
function bump(id, d){
  const r = IX.objet[id]; if(!r) return;
  const max = Math.max(1, dispoOf(r));
  const v = Math.min(max, Math.max(0, (S.bag[id]||0) + d));
  if(v) S.bag[id] = v; else delete S.bag[id];
  const cell = $("bag-"+id);
  if(cell){
    cell.textContent = v;
    const stp = cell.closest(".step"); if(stp) stp.classList.toggle("on", !!v);
    const card = cell.closest(".blk"); if(card) card.classList.toggle("picked", !!v);
  }
  paintBag();
}
function paintBag(){
  const n = bagTotal(), k = Object.keys(S.bag).length;
  $("actions").innerHTML = n ? `<div class="actionbar">
      <button class="btn ghost" id="clr">Vider</button>
      <button class="btn primary" id="ok">Ajouter ${k} ligne${k>1?"s":""} (${n})</button></div>`
    : `<div class="actionbar"><div class="hint">Touche les objets à emporter. Tu ajusteras les quantités avec − et +.</div>
      <button class="btn ghost wide" id="clr2">Retour</button></div>`;
  const c=$("clr"); if(c) c.onclick=()=>{ S.bag={}; render(); };
  const c2=$("clr2"); if(c2) c2.onclick=()=>{ S.pick=null; S.bag={}; S.q=""; render(); top0(); };
  const o=$("ok"); if(o) o.onclick = saveBag;
}
async function saveBag(){
  const sid = S.pick.sortie, existing = lignesOf(sid);
  const add = [], patch = [];
  for(const id in S.bag){
    const prev = existing.find(l=>first(l.f["Objet"])===id);
    if(prev) patch.push({id:prev.id, fields:{"Quantité prévue":(prev.f["Quantité prévue"]||0)+S.bag[id]}});
    else add.push({fields:{Sortie:[sid], Objet:[id], "Quantité prévue":S.bag[id]}});
  }
  S.pick=null; S.bag={}; S.q=""; toast("Ajout à la liste…");
  try{
    if(add.length) await apiPost("lignes", add);
    if(patch.length) await apiPatch("lignes", patch);
    toast("Ajouté à la liste"); await load();
  }catch(e){ toast("Échec de l'ajout"); await load(); }
}

/* ======================= emprunter ======================= */
/* ce que les AUTRES unités acceptent de prêter */
function lendable(){
  const out = [];
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"] || !r.f["Prêtable"]) continue;
    const us = arr(r.f["Unité"]);
    if(!us.length || us.some(u=>myScope().includes(u))) continue;
    if(dispoOf(r) <= 0) continue;
    out.push(r);
  }
  return out;
}
/* ce que MON unité met à disposition */
function myLendable(){
  const out = [];
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"]) continue;
    if(!arr(r.f["Unité"]).some(u=>myScope().includes(u))) continue;
    out.push(r);
  }
  return out;
}

    <button data-e="nous" aria-pressed="${S.emp==="nous"}">Ce que nous prêtons</button></div>`;

          <span class="row-right"><span class="tag">mettre au prêt</span></span></button>`).join("")}</div>`;
  }

  $("main").innerHTML = `<div class="crumb"><button class="back" id="back">‹</button>

  document.querySelectorAll("[data-borrow]").forEach(b=>b.onclick=()=>sheetTake([b.dataset.borrow]));
  document.querySelectorAll("[data-lend]").forEach(b=>b.onclick=()=>setLend(b.dataset.lend, true));
  wireBlocks();
}
async function setLend(id, v){

       toast(v?"Mis au prêt":"Retiré du prêt"); }

}

/* ======================= réglages (intendant) ======================= */
function renderReglages(){
  const seg = `<div class="seg" id="aseg">
    <button data-a="lieux" aria-pressed="${S.adm==="lieux"}">Emplacements</button>
    <button data-a="cats" aria-pressed="${S.adm==="cats"}">Catégories</button>
    <button data-a="unites" aria-pressed="${S.adm==="unites"}">Unités</button>
    <button data-a="gens" aria-pressed="${S.adm==="gens"}">Personnes</button></div>`;
  let body = "", action = "";

  if(S.adm === "lieux"){
    const counts = lieuCounts(false);
    const list = [...DB.lieux].sort((a,b)=>(a.f["Ordre"]||99)-(b.f["Ordre"]||99));
    body = `<div class="eyebrow">${list.length} emplacement${list.length>1?"s":""}</div>
      <div class="rows">${list.map(l=>{
        const n = counts[l.id]||0, off = l.f["Active"]===false;
        return `<button class="row ${off?"off":""}" data-el="${l.id}">
          <span class="row-bar"></span>
          <span class="row-main"><span class="row-name">${esc(l.f["Nom"])}</span>
            <span class="row-sub">${esc(l.f["Type"]||"")}${off?" · désactivé":""} · ordre ${l.f["Ordre"]||"—"}</span></span>
          <span class="row-right"><div class="row-count num">${n}</div></span>
          <span class="chev">›</span></button>`;}).join("")}</div>
      ${counts["_"]?`<p class="note">${counts["_"]} objet${counts["_"]>1?"s n'ont":" n'a"} pas d'emplacement.</p>`:""}`;
    action = `<button class="btn primary wide" id="new">+ Nouvel emplacement</button>`;
  }

  if(S.adm === "cats"){
    const tree = (parent, depth)=> DB.cats
      .filter(c=>(first(c.f["Catégorie parente"])||null)===parent)
      .sort((a,b)=>(a.f["Ordre"]||99)-(b.f["Ordre"]||99))
      .map(c=>{
        const n = [...DB.objets,...DB.conso].filter(r=>{const x=catOf(r); return x&&x.id===c.id;}).length;
        const us = arr(c.f["Unités"]);
        const badges = [isShared(c)?`<span class="tag sh">partagé</span>`:"",
                        isLocked(c)?`<span class="tag lk">verrouillé</span>`:""].filter(Boolean).join(" ");
        return `<button class="row ${c.f["Active"]?"":"off"}" data-ec="${c.id}">
          <span class="row-bar"></span>
          <span class="row-main"><span class="row-name">${"— ".repeat(depth)}${esc(c.f["Nom"])}</span>
            <span class="row-sub">${us.length?us.map(uName).join(", "):"toutes les unités"}${badges?" · ":""}${badges}</span></span>
          <span class="row-right"><div class="row-count num">${n}</div></span>
          <span class="chev">›</span></button>` + tree(c.id, depth+1);
      }).join("");
    body = `<div class="eyebrow">${DB.cats.length} catégorie${DB.cats.length>1?"s":""}</div>
      <div class="rows">${tree(null,0)}</div>
      <p class="note">Une catégorie verrouillée ne peut être remplie que par toi. Une catégorie
        partagée a un stock commun entre les unités qui y sont rattachées.</p>`;
    action = `<button class="btn primary wide" id="new">+ Nouvelle catégorie</button>`;
  }

  if(S.adm === "unites"){
    const list = [...DB.unites].sort((a,b)=>norm(a.f["Nom"]).localeCompare(norm(b.f["Nom"]),"fr"));
    body = `<div class="eyebrow">Unités et patrouilles</div>
      <div class="rows">${list.map(u=>{
        const c = countsFor(u.id);
        return `<button class="row ${u.f["Actif"]?"":"off"}" data-eu="${u.id}">
          <span class="row-bar"></span>
          <span class="row-main"><span class="row-name">${esc(u.f["Nom"])}</span>
            <span class="row-sub">${esc(u.f["Type"]||"")}${u.f["Unité parente"]?" · "+esc(uName(first(u.f["Unité parente"]))):""}
              ${u.f["Actif"]?"":" · inactive"}</span></span>
          <span class="row-right"><div class="row-count num">${c.total}</div></span>
          <span class="chev">›</span></button>`;}).join("")}</div>
      <p class="note">Les codes d'accès ne sont jamais renvoyés par le serveur — même toi ne peux
        pas les relire ici. Tu peux en définir un nouveau à tout moment.</p>`;
    action = `<button class="btn primary wide" id="new">+ Nouvelle unité</button>`;
  }

  if(S.adm === "gens"){
    const list = [...DB.personnes].sort((a,b)=>norm(a.f["Nom"]).localeCompare(norm(b.f["Nom"]),"fr"));
    body = `<div class="eyebrow">${list.length} personne${list.length>1?"s":""}</div>
      ${list.length?`<div class="rows">${list.map(p=>{
        const n = DB.mvts.filter(m=>first(m.f["Personne"])===p.id).length;
        return `<button class="row ${p.f["Actif"]===false?"off":""}" data-ep="${p.id}">
          <span class="row-bar"></span>
          <span class="row-main"><span class="row-name">${esc(p.f["Nom"])}</span>
            <span class="row-sub">${esc(arr(p.f["Unité"]).map(uName)[0]||"—")}${p.f["Actif"]===false?" · inactive":""}</span></span>
          <span class="row-right"><div class="row-count num">${n}</div></span>
          <span class="chev">›</span></button>`;}).join("")}</div>`
      :`<div class="empty"><div class="big">Personne encore</div>
        Chaque personne est créée automatiquement la première fois qu'elle entre son prénom.</div>`}`;
  }

  $("main").innerHTML = `<div class="crumb"><div><h2>Réglages</h2>
      <p>Tout ce qui structure l'inventaire. Visible par toi seul.</p></div></div>${seg}${body}`;
  $("actions").innerHTML = action ? `<div class="actionbar">${action}</div>` : "";
  $("aseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.adm=b.dataset.a; render(); top0(); });
  const nw = $("new");
  if(nw) nw.onclick = ()=>{
    if(S.adm==="lieux")  sheetLieu(null);
    if(S.adm==="cats")   sheetCat(null, null, null);
    if(S.adm==="unites") sheetUnite(null);
  };
  document.querySelectorAll("[data-el]").forEach(b=>b.onclick=()=>sheetLieu(IX.lieu[b.dataset.el]));
  document.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>{
    const c = IX.cat[b.dataset.ec]; sheetCat(c, first(arr(c.f["Unités"]))||null, first(c.f["Catégorie parente"])||null); });
  document.querySelectorAll("[data-eu]").forEach(b=>b.onclick=()=>sheetUnite(IX.unite[b.dataset.eu]));
  document.querySelectorAll("[data-ep]").forEach(b=>b.onclick=()=>sheetPersonne(IX.personne[b.dataset.ep]));
}

/* ======================= feuilles ======================= */
function closeSheet(){ $("modal").innerHTML=""; }
function openSheet(html){
  $("modal").innerHTML = `<div class="scrim" id="scrim"><div class="sheet">${html}</div></div>`;
  $("scrim").onclick = e => { if(e.target.id==="scrim") closeSheet(); };
}
function chipRow(id, values, current){
  return `<div class="chips" id="${id}">${values.map(t=>
    `<button class="chip" data-t="${esc(t)}" aria-pressed="${t===current}">${esc(t)}</button>`).join("")}</div>`;
}
function wireChips(id, onPick){
  const box = $(id); if(!box) return;
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    box.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===c)));
    onPick(c.dataset.t); });
}
function checkRow(id, label, sub, on){
  return `<button class="check" id="${id}" aria-pressed="${!!on}">
    <span class="bx">✓</span><span>${esc(label)}${sub?`<small>${esc(sub)}</small>`:""}</span></button>`;
}
function wireCheck(id, onToggle){
  const b = $(id); if(!b) return;
  b.onclick = ()=>{ const v = b.getAttribute("aria-pressed")!=="true";
    b.setAttribute("aria-pressed", String(v)); onToggle(v); };
}

function sheetLogin(){
  openSheet(`<h3>Code d'accès</h3>
    <p class="lede">Le code de ton unité. Demande-le à l'intendant du groupe.</p>
    <div class="field"><label for="cd">Code</label>
      <input id="cd" type="text" placeholder="CEN-0000" autocapitalize="characters"
             autocomplete="off" spellcheck="false" style="font-family:var(--mono);letter-spacing:.08em"></div>
    <div class="field"><label for="nm">Ton prénom</label>
      <input id="nm" type="text" placeholder="Rawad" autocomplete="given-name"></div>
    <div id="loginErr"></div>
    <button class="btn primary wide" id="ok">Entrer</button>`);
  const go = async ()=>{
    const code=$("cd").value.trim(), nom=$("nm").value.trim();
    if(!code) return $("cd").focus();
    if(!nom) return $("nm").focus();
    const btn=$("ok"); btn.disabled=true; btn.textContent="Vérification…";
    let res; try{ res = await apiAuth(code); }catch(e){ res={ok:false,reason:"Serveur injoignable"}; }
    if(!res.ok){ btn.disabled=false; btn.textContent="Entrer";
      $("loginErr").innerHTML=`<div class="banner err">${esc(res.reason||"Code refusé")}</div>`; return; }
    let p = DB.personnes.find(x=>norm(x.f["Nom"])===norm(nom));
    if(!p){ try{
      const rec = (await apiPost("personnes",[{fields:{Nom:nom,"Unité":[res.unitId],Actif:true,
        "Rôle": res.role==="intendant"?"Intendant de groupe":"Gérant d'unité"}}]))[0];
      p={id:rec.id,f:rec.fields}; DB.personnes.push(p); IX.personne[p.id]=p;
    }catch(e){} }
    S.me={nom, unite:res.unitId, role:res.role, pid:p?p.id:null};
    try{ localStorage.setItem(LS, JSON.stringify(S.me)); }catch(e){}
    S.pov = res.role==="gerant" ? res.unitId : null;
    S.ctx = S.pov; S.cat=null; closeSheet();
    DB.unites.length ? render() : load();
  };
  $("ok").onclick = go;
  $("cd").onkeydown = e=>{ if(e.key==="Enter") $("nm").focus(); };
  $("nm").onkeydown = e=>{ if(e.key==="Enter") go(); };
  setTimeout(()=>$("cd").focus(), 50);
}

/* ---------- le menu ··· d'un objet ---------- */
function sheetDots(id){
  const r = IX.objet[id]; if(!r) return;
  const cat = catOf(r), out = OUTQ[id]||0, dispo = dispoOf(r);
  const editable = canEdit(cat);
  const photo = arr(r.f["Photo"])[0];
  const lieu = lieuOf(r);
  const mien = isMine(r);
  openSheet(`<h3>${esc(r.f["Nom"])}</h3>
    <p class="lede">${esc(r.f["Code"]||"")}${lieu?" · "+esc(lieu.f["Nom"]):""}
      ${out?` · ${out} dehors`:""}</p>
    ${photo?`<img class="bigphoto" src="${esc(photo.url)}" alt="">`:""}
    <div class="menu">
      ${dispo>0?`<button id="take"><span class="mi">↗</span><span>Je prends
        <span class="msub">${dispo} disponible${dispo>1?"s":""}</span></span></button>`:""}
      ${out?`<button id="give"><span class="mi">↩</span><span>Je rends
        <span class="msub">${out} dehors</span></span></button>`:""}
      ${editable?`<button id="edit"><span class="mi">✎</span><span>Modifier
        <span class="msub">nom, quantité, emplacement, catégorie</span></span></button>`:""}
      <button id="cam"><span class="mi">◉</span><span>Prendre une photo
        <span class="msub">avec l'appareil</span></span></button>
      <button id="gal"><span class="mi">▤</span><span>Choisir une photo
        <span class="msub">dans la galerie</span></span></button>
      ${mien?`<button id="lend"><span class="mi">${r.f["Prêtable"]?"◉":"○"}</span><span>${r.f["Prêtable"]?"Ne plus prêter":"Mettre au prêt"}
        <span class="msub">${r.f["Prêtable"]?"visible par les autres unités":"les autres unités pourront l'emprunter"}</span></span></button>`:""}
      <button id="hist"><span class="mi">≡</span><span>Historique</span></button>
      <button id="lost" class="dgr"><span class="mi">⚠</span><span>Déclarer perdu
        <span class="msub">retiré de l'inventaire, gardé dans l'historique</span></span></button>
      ${editable?`<button id="arch" class="dgr"><span class="mi">□</span><span>Archiver</span></button>`:""}
    </div>
    <input type="file" id="pcam" accept="image/*" capture="environment" hidden>
    <input type="file" id="pgal" accept="image/*" hidden>`);

  const on = (elId, fn)=>{ const e=$(elId); if(e) e.onclick=fn; };
  on("take", ()=>{ closeSheet(); sheetTake([id], null); });
  on("give", ()=>{ closeSheet(); sheetReturn([{id, q:out}], null); });
  on("edit", ()=>{ closeSheet(); sheetItem(r, cat); });
  on("hist", ()=>{ closeSheet(); sheetHist(id); });
  on("cam",  ()=> $("pcam").click());
  on("gal",  ()=> $("pgal").click());
  on("lend", ()=>{ closeSheet(); setLend(id, !r.f["Prêtable"]); });

  const send = async (inp)=>{
    const f = inp.files[0]; if(!f) return;
    closeSheet(); toast("Envoi de la photo…");
    try{
      const d = await shrink(f);
      await apiUpload(tableOf(r), id, d, (r.f["Code"]||"photo")+".jpg");
      toast("Photo enregistrée"); await load();
    }catch(err){ toast(err.message || "Échec de l'envoi"); }
  };
  $("pcam").onchange = ()=>send($("pcam"));
  $("pgal").onchange = ()=>send($("pgal"));

  on("lost", async ()=>{
    closeSheet();
    const q = out || r.f["Quantité"] || 1;
    try{
      await apiPatch(tableOf(r), [{id, fields:{"État":"Perdu"}}]).catch(()=>{});
      await apiPost("mouvements", [{fields:{Type:"Perte déclarée", Date:new Date().toISOString(),
        "Quantité":q, Objet:[id], ...(S.me.pid?{Personne:[S.me.pid]}:{}),
        Notes:"Déclaré perdu depuis l'app"}}]);
      toast("Marqué perdu"); await load();
    }catch(err){ toast("Échec"); }
  });
  on("arch", async ()=>{
    closeSheet();
    try{ await apiPatch(tableOf(r), [{id, fields:{"Archivé":true}}]); toast("Archivé"); await load(); }
    catch(err){ toast("Échec de l'archivage"); }
  });
}

function sheetHist(id){
  const ms = DB.mvts.filter(m=>first(m.f["Objet"])===id)
    .sort((a,b)=>(b.f["Date"]||"").localeCompare(a.f["Date"]||"")).slice(0,25);

  openSheet(`<h3>Historique</h3><p class="lede">${esc(r?r.f["Nom"]:"")}</p>
    ${ms.length?`<div class="recap" style="max-height:340px">${ms.map(m=>{
      const who = arr(m.f["Personne"]).map(p=>IX.personne[p]&&IX.personne[p].f["Nom"]).filter(Boolean)[0]||"?";

function sheetTake(ids, sortieId){
  const qtys = {};
  ids.forEach(id=>{ qtys[id] = Math.max(1, dispoOf(IX.objet[id])); });
  openSheet(`<h3>Tu prends ${ids.length} ligne${ids.length>1?"s":""}</h3>
    <p class="lede">Ajuste les quantités si tu n'en prends qu'une partie.</p>
    <div class="recap">${ids.map(id=>{
      const o = IX.objet[id], max = dispoOf(o);
      return `<div class="ln"><span>${esc(o.f["Nom"])}</span>
        <input type="number" min="1" max="${max}" value="${qtys[id]}" data-q="${id}"></div>`;}).join("")}</div>
    <div class="two">
      <div class="field"><label for="due">Retour prévu</label><input id="due" type="date"></div>
      <div class="field"><label for="chez">Où ça part</label>
        <input id="chez" type="text" placeholder="chez Jad, au camp…"></div>
    </div>
    <button class="btn primary wide" id="ok">Confirmer</button>`);
  $("ok").onclick = async ()=>{
    document.querySelectorAll("[data-q]").forEach(i=>{ qtys[i.dataset.q] = Math.max(1, +i.value||1); });
    const due = $("due").value, chez = $("chez").value.trim();
    closeSheet();
    const recs = ids.map(id=>{
      const owner = arr(IX.objet[id].f["Unité"]);
      const emprunt = owner.length && !owner.some(u=>myScope().includes(u));
      return { fields:{ Type:"Sortie", Date:new Date().toISOString(), "Quantité":qtys[id],
        Objet:[id], ...(S.me.pid?{Personne:[S.me.pid]}:{}), "Unité emprunteuse":[S.me.unite],
        ...(sortieId?{Sortie:[sortieId]}:{}), ...(due?{"Retour prévu":due}:{}), ...(chez?{"Chez qui":chez}:{}),
        ...(emprunt?{"Statut emprunt":"Sans réponse"}:{}) } };
    });
    await commit(recs, "C'est noté — préviens le chef concerné");
  };
}

function sheetReturn(list, sortieId){

}

  wireChips("tp", t=>{ type=t; if(!$("nm").value.trim()) $("nm").value = t + " " + new Date().getFullYear(); });
  $("ok").onclick = async ()=>{
    const nom = $("nm").value.trim() || (type + " " + new Date().getFullYear());
    const f = { Nom:nom, Type:type, Lieu:$("lu").value.trim(),
      ...($("d1").value?{"Départ":$("d1").value}:{}),
      ...($("d2").value?{"Retour prévu":$("d2").value}:{}) };
    closeSheet();
    try{
      if(isNew){
        f.Statut = "Préparation"; f["Unité"] = [S.me.unite];
        const rec = (await apiPost("sorties",[{fields:f}]))[0];
        await load(); S.tab="sorties"; S.sortie=rec.id;
        S.pick = {sortie:rec.id}; S.bag={}; S.q=""; render(); top0();
        toast("Sortie créée — choisis le matériel");
      }else{
        await apiPatch("sorties",[{id:s.id, fields:f}]); toast("Enregistré"); await load();
      }
    }catch(e){ toast("Échec de l'enregistrement"); }
  };
}

function sheetLieu(l){
  const isNew = !l;
  const types = ["Étagère","Coin d'unité","Bancoffre","Caisse ou boîte","Zone au sol","Hors du local","Autre"];
  let type = l ? (l.f["Type"]||"Autre") : "Étagère";
  const n = l ? (lieuCounts(false)[l.id]||0) : 0;
  const others = DB.lieux.filter(x=>x.f["Active"]!==false && (!l || x.id!==l.id))
    .sort((a,b)=>(a.f["Ordre"]||99)-(b.f["Ordre"]||99));
  openSheet(`<h3>${isNew?"Nouvel emplacement":"Modifier l'emplacement"}</h3>
    <p class="lede">Un endroit précis du local, que quelqu'un puisse retrouver sans demander.${
      n?` Contient ${n} objet${n>1?"s":""}.`:""}</p>
    <div class="field"><label>Type</label>${chipRow("tp", types, type)}</div>
    <div class="field"><label for="nm">Nom</label>
      <input id="nm" type="text" value="${esc(l?l.f["Nom"]:"")}" placeholder="Étagère A"></div>
    <div class="field"><label for="ds">Où c'est exactement</label>
      <textarea id="ds" rows="2" placeholder="À droite en entrant, au-dessus des bidons">${esc(l?l.f["Description"]:"")}</textarea></div>
    <div class="field"><label for="or">Ordre d'affichage</label>
      <input id="or" type="number" min="1" value="${l&&l.f["Ordre"]!=null?l.f["Ordre"]:50}">
      <div class="hint">Les petits nombres remontent en haut de la liste.</div></div>
    ${!isNew?checkRow("ac","Actif","Décoché, il disparaît des listes de choix.", l.f["Active"]!==false):""}
    <button class="btn primary wide" id="ok">${isNew?"Ajouter":"Enregistrer"}</button>
    ${!isNew && n ? `<button class="btn ghost wide" id="mv" style="margin-top:10px">
      Déplacer les ${n} objets ailleurs</button>` : ""}`);
  let actif = isNew ? true : l.f["Active"]!==false;
  wireChips("tp", t=>type=t);
  wireCheck("ac", v=>actif=v);
  $("ok").onclick = async ()=>{
    const nom = $("nm").value.trim(); if(!nom) return $("nm").focus();
    const dup = DB.lieux.find(x=>norm(x.f["Nom"])===norm(nom) && (!l || x.id!==l.id));
    if(dup){ toast("« "+dup.f["Nom"]+" » existe déjà"); return; }
    const f = { Nom:nom, Type:type, Description:$("ds").value.trim(),
                Ordre:+$("or").value||50, Active:actif };
    closeSheet();
    try{
      if(isNew) await apiPost("emplacements",[{fields:f}]);
      else await apiPatch("emplacements",[{id:l.id, fields:f}]);
      toast(isNew?"Emplacement ajouté":"Enregistré"); await load();
    }catch(e){ toast("Échec de l'enregistrement"); }
  };
  const mv = $("mv");
  if(mv) mv.onclick = ()=>{
    openSheet(`<h3>Déplacer ${n} objet${n>1?"s":""}</h3>
      <p class="lede">Tout ce qui est rangé dans « ${esc(l.f["Nom"])} » ira ailleurs.</p>
      <div class="field"><label for="dst">Nouvel emplacement</label>
        <select id="dst">${others.map(x=>`<option value="${x.id}">${esc(x.f["Nom"])}</option>`).join("")}</select></div>
      <button class="btn primary wide" id="go">Déplacer</button>`);
    $("go").onclick = async ()=>{
      const dst = $("dst").value; if(!dst) return;
      closeSheet(); toast("Déplacement…");
      const byTable = {objets:[], consommables:[]};
      for(const src of [DB.objets, DB.conso]) for(const r of src){
        const x = lieuOf(r); if(!x || x.id !== l.id) continue;
        byTable[tableOf(r)].push({id:r.id, fields:{[lieuField(r)]:[dst]}});
      }
      try{
        if(byTable.objets.length) await apiPatch("objets", byTable.objets);
        if(byTable.consommables.length) await apiPatch("consommables", byTable.consommables);
        toast("Déplacé"); await load();
      }catch(e){ toast("Échec du déplacement"); await load(); }
    };
  };
}

function sheetCat(c, unitId, parentId){
  const isNew = !c;
  const mesures = ["Aucune","Longueur (cm)","Diamètre (cm)","Volume (L)","Taille nommée"];
  const contenus = ["Objets","Consommables"];
  let mesure = c ? (c.f["Mesure"]||"Aucune") : "Aucune";
  let contenu = c ? (c.f["Type de contenu"]||"Objets") : "Objets";
  let partage = c ? !!c.f["Partagée"] : false;
  let verrou  = c ? !!c.f["Verrouillée"] : false;
  let active  = c ? c.f["Active"]!==false : true;
  const n = c ? [...DB.objets,...DB.conso].filter(r=>{const x=catOf(r); return x&&x.id===c.id;}).length : 0;
  const parents = DB.cats.filter(x=>x.f["Active"] && (!c || x.id!==c.id))
    .sort((a,b)=>norm(a.f["Nom"]).localeCompare(norm(b.f["Nom"]),"fr"));
  const unites = DB.unites.filter(u=>u.f["Actif"])
    .sort((a,b)=>norm(a.f["Nom"]).localeCompare(norm(b.f["Nom"]),"fr"));
  const curU = c ? arr(c.f["Unités"]) : (unitId?[unitId]:[]);
  const admin = isAdmin();

  openSheet(`<h3>${isNew?"Nouvelle catégorie":"Modifier la catégorie"}</h3>
    <p class="lede">${isNew?"Une section de l'inventaire.":`${n} ligne${n>1?"s":""} dedans.`}</p>
    <div class="field"><label for="nm">Nom</label>
      <input id="nm" type="text" value="${esc(c?c.f["Nom"]:"")}" placeholder="Cuisine"></div>
    <div class="field"><label for="pa">Dans quelle section</label>
      <select id="pa"><option value="">— section de premier niveau —</option>
      ${parents.map(x=>`<option value="${x.id}" ${parentId===x.id?"selected":""}>${esc(x.f["Nom"])}</option>`).join("")}</select></div>
    <div class="field"><label for="un">Pour quelle unité</label>
      <select id="un"><option value="">— toutes les unités —</option>
      ${unites.map(u=>`<option value="${u.id}" ${curU.includes(u.id)?"selected":""}>${esc(u.f["Nom"])}</option>`).join("")}</select>
      <div class="hint">« Toutes » = catégorie de base, présente dans chaque unité.</div></div>
    <div class="field"><label>Contenu</label>${chipRow("ct", contenus, contenu)}</div>
    <div class="field"><label>Mesure des lignes</label>${chipRow("ms", mesures, mesure)}
      <div class="hint">Une mesure chiffrée active le regroupement par intervalle (10 ou 25 cm).</div></div>
    <div class="field"><label for="or">Ordre d'affichage</label>
      <input id="or" type="number" min="1" value="${c&&c.f["Ordre"]!=null?c.f["Ordre"]:50}"></div>
    ${admin?checkRow("sh","Stock partagé","Le même stock pour plusieurs unités.",partage):""}
    ${admin?checkRow("lk","Verrouillée","Toi seul peux y ajouter, renommer ou retirer.",verrou):""}
    ${!isNew?checkRow("ac","Active","Décochée, la catégorie disparaît de l'app.",active):""}
    <button class="btn primary wide" id="ok">${isNew?"Créer":"Enregistrer"}</button>`);
  wireChips("ct", t=>contenu=t);
  wireChips("ms", t=>mesure=t);
  wireCheck("sh", v=>partage=v);
  wireCheck("lk", v=>verrou=v);
  wireCheck("ac", v=>active=v);
  $("ok").onclick = async ()=>{
    const nom = $("nm").value.trim(); if(!nom) return $("nm").focus();
    const u = $("un").value, pa = $("pa").value;
    const f = { Nom:nom, "Type de contenu":contenu, "Mesure":mesure,
      "Ordre":+$("or").value||50, Active:active,
      "Catégorie parente": pa?[pa]:[], "Unités": u?[u]:[] };
    if(admin){ f["Partagée"]=partage; f["Verrouillée"]=verrou; }
    closeSheet();
    try{
      if(isNew) await apiPost("categories",[{fields:f}]);
      else await apiPatch("categories",[{id:c.id, fields:f}]);
      toast(isNew?"Catégorie créée":"Enregistré"); await load();
    }catch(e){ toast("Échec de l'enregistrement"); }
  };
}

function sheetUnite(u){
  const isNew = !u;
  const types = ["Groupe","Meute","Troupe","Clan","Patrouille","Sizaine"];
  let type = u ? (u.f["Type"]||"Patrouille") : "Patrouille";
  let actif = u ? !!u.f["Actif"] : true;
  const parents = DB.unites.filter(x=>!x.f["Unité parente"] && (!u || x.id!==u.id))
    .sort((a,b)=>norm(a.f["Nom"]).localeCompare(norm(b.f["Nom"]),"fr"));
  const curP = u ? first(u.f["Unité parente"])||"" : "";
  openSheet(`<h3>${isNew?"Nouvelle unité":esc(u.f["Nom"])}</h3>
    <p class="lede">${isNew?"Une unité ou une patrouille.":"Nom, rattachement, code d'accès."}</p>
    <div class="field"><label for="nm">Nom</label>
      <input id="nm" type="text" value="${esc(u?u.f["Nom"]:"")}" placeholder="Patrouille Élan"></div>
    <div class="field"><label>Type</label>${chipRow("tp", types, type)}</div>
    <div class="field"><label for="pa">Rattachée à</label>
      <select id="pa"><option value="">— unité de premier niveau —</option>
      ${parents.map(x=>`<option value="${x.id}" ${curP===x.id?"selected":""}>${esc(x.f["Nom"])}</option>`).join("")}</select></div>
    <div class="field"><label for="cd">Préfixe de code</label>
      <input id="cd" type="text" value="${esc(u?u.f["Code"]:"")}" placeholder="ELA" maxlength="6"
             style="font-family:var(--mono);text-transform:uppercase">
      <div class="hint">Sert à fabriquer les codes d'objets : ELA-CUI-01.</div></div>
    <div class="field"><label for="ac">Code d'accès</label>
      <input id="ac" type="text" placeholder="${u?"laisser vide = inchangé":"ELA-2027"}"
             autocapitalize="characters" autocomplete="off" spellcheck="false"
             style="font-family:var(--mono);letter-spacing:.06em">
      <div class="hint">Le serveur ne renvoie jamais les codes existants — même ici. Écris-en un
        nouveau pour le remplacer.</div></div>
    ${checkRow("at","Active","Décochée, l'unité et son code ne fonctionnent plus.",actif)}
    <button class="btn primary wide" id="ok">${isNew?"Créer":"Enregistrer"}</button>`);
  wireChips("tp", t=>type=t);
  wireCheck("at", v=>actif=v);
  $("ok").onclick = async ()=>{
    const nom = $("nm").value.trim(); if(!nom) return $("nm").focus();
    const code = $("cd").value.trim().toUpperCase();
    const acc = $("ac").value.trim();
    const pa = $("pa").value;
    const f = { Nom:nom, Type:type, Actif:actif, Code:code,
                "Unité parente": pa?[pa]:[] };
    if(acc) f["Code d'accès"] = acc;
    closeSheet();
    try{
      if(isNew) await apiPost("unites",[{fields:f}]);
      else await apiPatch("unites",[{id:u.id, fields:f}]);
      toast(acc ? "Enregistré — nouveau code actif" : "Enregistré"); await load();
    }catch(e){ toast("Échec de l'enregistrement"); }
  };
}

function sheetPersonne(p){
  if(!p) return;
  const n = DB.mvts.filter(m=>first(m.f["Personne"])===p.id).length;
  let actif = p.f["Actif"]!==false;
  const unites = DB.unites.filter(u=>u.f["Actif"])
    .sort((a,b)=>norm(a.f["Nom"]).localeCompare(norm(b.f["Nom"]),"fr"));
  const cur = first(p.f["Unité"])||"";
  openSheet(`<h3>${esc(p.f["Nom"])}</h3>
    <p class="lede">${n} mouvement${n>1?"s":""} enregistré${n>1?"s":""}.</p>
    <div class="field"><label for="nm">Nom</label>
      <input id="nm" type="text" value="${esc(p.f["Nom"])}"></div>
    <div class="field"><label for="un">Unité</label>
      <select id="un"><option value="">—</option>
      ${unites.map(u=>`<option value="${u.id}" ${cur===u.id?"selected":""}>${esc(u.f["Nom"])}</option>`).join("")}</select></div>
    ${checkRow("ac","Active","Décochée, elle n'apparaît plus dans l'app. L'historique reste.",actif)}
    <button class="btn primary wide" id="ok">Enregistrer</button>`);
  wireCheck("ac", v=>actif=v);
  $("ok").onclick = async ()=>{
    const nom = $("nm").value.trim(); if(!nom) return $("nm").focus();
    const u = $("un").value;
    closeSheet();
    try{ await apiPatch("personnes",[{id:p.id, fields:{Nom:nom, Actif:actif, "Unité":u?[u]:[]}}]);
      toast("Enregistré"); await load(); }
    catch(e){ toast("Échec"); }
  };
}

function sheetItem(o, cat){
  const isNew = !o;
  const table = o ? tableOf(o) : ((cat && cat.f["Type de contenu"] === "Consommables") ? "consommables" : "objets");
  const curCat = o ? catOf(o) : cat;
  const mesure = (curCat && curCat.f["Mesure"]) || "Aucune";
  const conso = table === "consommables";
  const curLieu = o ? lieuOf(o) : null;
  const curUnit = o ? first(o.f["Unité"]) : S.ctx;
  const lieux = DB.lieux.filter(x=>x.f["Active"]!==false)
    .sort((a,b)=>(a.f["Ordre"]||99)-(b.f["Ordre"]||99));
  const unites = DB.unites.filter(u=>u.f["Actif"] && (isAdmin() || subtree(S.pov||u.id).includes(u.id)))
    .sort((a,b)=>norm(a.f["Nom"]).localeCompare(norm(b.f["Nom"]),"fr"));
  /* catégories où l'on a le droit de ranger cet objet */
  const cats = DB.cats.filter(c=>{
    if(!c.f["Active"]) return false;
    if(isLocked(c) && !isAdmin()) return curCat && c.id===curCat.id;
    const us = arr(c.f["Unités"]);
    return !us.length || !curUnit || us.includes(curUnit) || (isAdmin() && true);
  }).sort((a,b)=>norm(a.f["Nom"]).localeCompare(norm(b.f["Nom"]),"fr"));
  let lend = o ? !!o.f["Prêtable"] : false;

  openSheet(`<h3>${isNew?"Nouvelle ligne":"Modifier"}</h3>
    <p class="lede">${esc(curCat?curCat.f["Nom"]:"")}${curCat&&isShared(curCat)?" · stock partagé":""}</p>
    <div class="field"><label for="nm">Nom</label>
      <input id="nm" type="text" value="${esc(o?o.f["Nom"]:"")}" placeholder="tanjara medium"></div>
    <div class="two">
      <div class="field"><label for="qt">Quantité</label>
        <input id="qt" type="number" min="0" value="${o&&o.f["Quantité"]!=null?o.f["Quantité"]:1}"></div>
      ${/Longueur|Diam/.test(mesure)?`<div class="field"><label for="ln">${esc(mesure)}</label>
        <input id="ln" type="number" step="0.1" value="${o&&o.f["Longueur (cm)"]!=null?o.f["Longueur (cm)"]:""}"></div>`
      : /Volume/.test(mesure)?`<div class="field"><label for="vl">Volume (L)</label>
        <input id="vl" type="number" step="0.1" value="${o&&o.f["Volume (L)"]!=null?o.f["Volume (L)"]:""}"></div>`
      :`<div class="field"><label for="tl">Taille / détail</label>
        <input id="tl" type="text" value="${esc(o?o.f["Taille / détail"]:"")}" placeholder="kbire, grande…"></div>`}
    </div>
    <div class="field"><label for="lc">Où c'est rangé</label>
      <select id="lc"><option value="">— non précisé —</option>
      ${lieux.map(x=>`<option value="${x.id}" ${curLieu&&curLieu.id===x.id?"selected":""}>${esc(x.f["Nom"])}</option>`).join("")}</select></div>
    <div class="field"><label for="cg">Catégorie</label>
      <select id="cg">${cats.map(c=>`<option value="${c.id}" ${curCat&&curCat.id===c.id?"selected":""}>${esc(c.f["Nom"])}${isLocked(c)?" (verrouillée)":""}</option>`).join("")}</select></div>
    <div class="field"><label for="un">À qui c'est</label>
      <select id="un">${unites.map(u=>`<option value="${u.id}" ${curUnit===u.id?"selected":""}>${esc(u.f["Nom"])}</option>`).join("")}</select>
      <div class="hint">Change-le si l'objet passe d'une patrouille à une autre.</div></div>
    ${conso?`<div class="two">
      <div class="field"><label for="us">Usage</label>
        <input id="us" type="text" value="${esc(o?o.f["Usage"]:"")}" placeholder="mal de tête"></div>
      <div class="field"><label for="ex">Expiration</label>
        <input id="ex" type="date" value="${esc(o&&o.f["Date d'expiration"]?o.f["Date d'expiration"]:"")}"></div>
    </div>`:""}
    ${checkRow("pr","Prêtable","Les autres unités peuvent l'emprunter.",lend)}
    <button class="btn primary wide" id="ok">${isNew?"Ajouter":"Enregistrer"}</button>`);
  wireCheck("pr", v=>lend=v);
  $("ok").onclick = async ()=>{
    const nom = $("nm").value.trim(); if(!nom) return $("nm").focus();
    const newCat = IX.cat[$("cg").value] || curCat;
    const newUnit = $("un").value;
    const f = { Nom:nom, "Quantité": +$("qt").value || 0, "Prêtable": lend };
    if($("ln") && $("ln").value!=="") f["Longueur (cm)"] = +$("ln").value;
    if($("vl") && $("vl").value!=="") f["Volume (L)"] = +$("vl").value;
    if($("tl")) f["Taille / détail"] = $("tl").value.trim();
    if($("us")) f["Usage"] = $("us").value.trim();
    if($("ex") && $("ex").value) f["Date d'expiration"] = $("ex").value;
    const lc = $("lc").value;
    f[table==="consommables" ? "Emplacement (lien)" : "Emplacement"] = lc ? [lc] : [];
    if(newCat) f["Catégorie"] = [newCat.id];
    f["Unité"] = isShared(newCat) ? arr(newCat.f["Unités"]) : (newUnit ? [newUnit] : []);
    closeSheet();
    try{
      if(isNew){
        f["Code"] = codeFor(newCat, newUnit);
        if(table==="objets") f["État"] = "Bon";
        await apiPost(table, [{fields:f}]); toast("Ligne ajoutée");
      }else{
        await apiPatch(table, [{id:o.id, fields:f}]); toast("Enregistré");
      }
      await load();
    }catch(e){ toast("Échec de l'enregistrement"); }
  };
}
function codeFor(cat, unitId){
  const u = IX.unite[unitId || S.ctx];
  const uc = (u && u.f["Code"]) || "XXX";
  const cc = norm(cat?cat.f["Nom"]:"").replace(/[^a-z]/g,"").slice(0,3).toUpperCase() || "GEN";
  const n = [...DB.objets, ...DB.conso].filter(r=>(r.f["Code"]||"").startsWith(`${uc}-${cc}-`)).length + 1;
  return `${uc}-${cc}-${String(n).padStart(2,"0")}`;
}

async function commit(records, okMsg){
  try{ await apiPost("mouvements", records); toast(okMsg); await load(); }
  catch(e){ toast("Échec : " + (e.message||"")); }
}

/* ======================= câblage ======================= */
function wireGo(){ document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
  S.ctx=b.dataset.go; S.cat=null; render(); top0(); }); }
function wireCat(){ document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
  S.cat=b.dataset.cat; render(); top0(); }); }
function wireBlocks(){
  document.querySelectorAll("[data-dots]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); sheetDots(b.dataset.dots); });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>sheetDots(b.dataset.open));
}

$("whoBtn").onclick = sheetWho;
load();
</script>
</body>
</html>
