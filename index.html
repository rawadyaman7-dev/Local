<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Local — Intendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --paper:#F6F6F3; --surface:#FFFFFF; --sunk:#EFEFEB;
    --ink:#16191A; --muted:#6B716D; --faint:#9AA09B;
    --line:#DEDFDA; --line-strong:#C8CAC4;
    --pine:#285943; --pine-soft:#E4EDE7;
    --signal:#B25B14; --signal-soft:#FAEDE0;
    --alert:#A32E23; --alert-soft:#FAE5E2;
    --shadow:0 1px 2px rgba(20,25,20,.06), 0 4px 14px rgba(20,25,20,.05);
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,sans-serif;
    color-scheme:light dark;
    padding-top:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#131614; --surface:#1C201E; --sunk:#242927;
      --ink:#E9EBE8; --muted:#9BA29D; --faint:#767D78;
      --line:#2E3431; --line-strong:#3E4643;
      --pine:#72C09A; --pine-soft:#1E2E26;
      --signal:#E0913F; --signal-soft:#2E2318;
      --alert:#E0776A; --alert-soft:#301D1A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  img{max-width:100%}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
       border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:10px;padding:10px 16px}
  .brand{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.02em;
         text-transform:uppercase;line-height:1;flex:1;min-width:0}
  .brand span{color:var(--pine)}
  .whoami{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line-strong);
          border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;max-width:60%}
  .whoami b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--pine);flex:none}
  .dot.adm{background:var(--signal)}
  .povbar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--signal-soft);
          border-bottom:1px solid var(--line);font-size:12.5px;color:var(--signal)}

  .wrap{padding:16px;padding-block:16px;flex:1}
  .eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;
           font-weight:600;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .eyebrow.sp{margin-top:24px}
  .code{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .num{font-variant-numeric:tabular-nums}
  .banner{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
          font-size:13px;color:var(--muted);margin-bottom:16px}
  .banner.err{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}

  .stats{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;
         overflow:hidden;margin-bottom:18px}
  .stat{flex:1;background:var(--surface);padding:11px 12px;min-width:0}
  .stat .v{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1;
           font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.25}
  .stat.out .v{color:var(--signal)} .stat.late .v{color:var(--alert)}

  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
       border:1px solid var(--line);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow)}
  .row:hover{border-color:var(--line-strong)}
  .row-bar{width:3px;align-self:stretch;border-radius:2px;background:var(--line-strong);flex:none}
  .row[data-out="1"] .row-bar{background:var(--signal)}
  .row.zero .row-bar{background:var(--line)}
  .row-main{flex:1;min-width:0}
  .row-name{font-family:var(--cond);font-size:18px;font-weight:600;line-height:1.15}
  .row-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .row-right{text-align:right;flex:none}
  .row-count{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .row-out{font-size:11.5px;color:var(--signal);font-weight:600;margin-top:1px}
  .chev{color:var(--faint);flex:none;font-size:18px}
  .row.zero .row-count{color:var(--faint);font-weight:400}

  .tag{display:inline-block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;
       font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--pine-soft);
       color:var(--pine);vertical-align:1px}
  .tag.sh{background:var(--signal-soft);color:var(--signal)}
  .tag.lk{background:var(--alert-soft);color:var(--alert)}

  /* ---------- blocs objets ---------- */
  .blocks{display:flex;flex-direction:column;gap:8px}
  .blk{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);
       border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
  .blk.out{border-color:var(--signal)}
  .blk.gone{opacity:.55}
  .blk-pick{display:flex;align-items:center;padding:0 0 0 12px}
  .blk-body{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 12px;text-align:left}
  .blk-txt{flex:1;min-width:0}
  .blk-name{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .blk-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
  .blk-qty{flex:none;text-align:right;min-width:62px}
  .blk-qty .n{font-family:var(--cond);font-size:22px;font-weight:700;line-height:1;
              font-variant-numeric:tabular-nums}
  .blk-qty .n.part{color:var(--signal)}
  .blk-qty .loc{font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.2;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:96px;margin-left:auto}
  .blk-dots{flex:none;width:40px;border-left:1px solid var(--line);display:grid;place-items:center;
            font-size:18px;color:var(--muted);letter-spacing:1px}
  .blk-dots:hover{background:var(--sunk);color:var(--ink)}
  .blk-thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;flex:none;background:var(--sunk)}

  .pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;
        font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em}
  .pill.out{background:var(--signal-soft);color:var(--signal)}
  .pill.late{background:var(--alert-soft);color:var(--alert)}
  .pill.exp{background:var(--alert-soft);color:var(--alert)}
  .pill.soon{background:var(--signal-soft);color:var(--signal)}

  .cbox{width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:6px;flex:none;
        display:grid;place-items:center;font-size:13px;color:transparent;background:var(--surface)}
  .blk.sel .cbox{background:var(--pine);border-color:var(--pine);color:#fff}
  .blk.sel{background:var(--pine-soft)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;
       border-radius:9px;font-family:var(--cond);font-size:16px;font-weight:600;letter-spacing:.03em;
       text-transform:uppercase;line-height:1}
  .btn.primary{background:var(--pine);color:#fff}
  .btn.danger{background:var(--alert);color:#fff}
  .btn.ghost{border:1px solid var(--line-strong)}
  .btn.sm{padding:8px 12px;font-size:13.5px}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .actionbar{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
             padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
             display:flex;gap:9px;flex-wrap:wrap}
  .actionbar .btn{flex:1;min-width:120px}

  .tabs{position:sticky;bottom:0;z-index:18;display:flex;background:var(--surface);
        border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
       font-family:var(--cond);font-size:11.5px;font-weight:600;text-transform:uppercase;
       letter-spacing:.04em;color:var(--faint);position:relative}
  .tab[aria-selected="true"]{color:var(--pine)}
  .tab .ic{font-size:17px;line-height:1}
  .tab .badge{position:absolute;top:4px;left:50%;margin-left:5px;background:var(--signal);color:#fff;
              font-family:var(--mono);font-size:9.5px;padding:0 4px;border-radius:999px}

  .search{display:flex;align-items:center;gap:9px;background:var(--surface);
          border:1px solid var(--line-strong);border-radius:9px;padding:0 12px;margin-bottom:14px}
  .search input{flex:1;border:none;background:none;padding:12px 0;outline:none;font-size:16px}

  .crumb{display:flex;align-items:flex-start;gap:11px;margin-bottom:14px}
  .back{font-size:22px;color:var(--muted);padding:2px 4px;margin-left:-4px;flex:none}
  .crumb h2{font-family:var(--cond);font-size:23px;font-weight:700;line-height:1.1;margin:0;
            text-wrap:balance}
  .crumb p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

  .seg{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;
       overflow:hidden;margin-bottom:12px}
  .seg button{flex:1;background:var(--surface);padding:7px 6px;font-size:12.5px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--pine);color:#fff;font-weight:600}

  .scrim{position:fixed;inset:0;z-index:40;background:rgba(15,20,17,.45);display:flex;
         align-items:flex-end;justify-content:center}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px;
         padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;
         border:1px solid var(--line);border-bottom:none}
  .sheet h3{font-family:var(--cond);font-size:21px;font-weight:700;margin:0 0 3px}
  .sheet .lede{font-size:13px;color:var(--muted);margin:0 0 15px}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;
               font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line-strong);
    border-radius:8px;background:var(--surface);font-size:16px;outline:none}
  .two{display:flex;gap:10px}.two>*{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:8px 13px;border:1px solid var(--line-strong);border-radius:999px;font-size:13.5px}
  .chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
  .recap{background:var(--sunk);border-radius:8px;padding:10px 12px;margin-bottom:15px;font-size:13px;
         max-height:190px;overflow:auto}
  .recap .ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;align-items:center}
  .recap input{width:64px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:6px;
               background:var(--surface);font-family:var(--mono);text-align:right;font-size:14px}
  .menu{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
        border-radius:10px;overflow:hidden}
  .menu button{background:var(--surface);padding:13px 14px;text-align:left;display:flex;
               align-items:center;gap:11px;font-size:15px}
  .menu button:hover{background:var(--sunk)}
  .menu button .mi{width:20px;text-align:center;color:var(--muted);flex:none}
  .menu button.dgr{color:var(--alert)}
  .menu button .msub{display:block;font-size:12px;color:var(--faint);margin-top:1px}

  .empty{text-align:center;padding:34px 20px;color:var(--muted)}
  .empty .big{font-family:var(--cond);font-size:19px;font-weight:600;color:var(--ink);margin-bottom:5px}
  .note{font-size:12.5px;color:var(--faint);margin-top:16px;line-height:1.45}
  .spin{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--cond);
        text-transform:uppercase;letter-spacing:.08em;font-size:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;background:var(--ink);
         color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;
         box-shadow:var(--shadow);max-width:90%}
  .bigphoto{width:100%;border-radius:10px;margin-bottom:14px;background:var(--sunk)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-in">
      <div class="brand">Le <span>Local</span></div>
      <button class="whoami" id="whoBtn"><span class="dot" id="whoDot"></span><b id="whoName">…</b></button>
    </div>
    <div id="povbar"></div>
  </header>
  <main class="wrap" id="main"><div class="spin">Chargement…</div></main>
  <div id="actions"></div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="home" aria-selected="true"><span class="ic">▤</span>Inventaire</button>
    <button class="tab" data-tab="sorties" aria-selected="false"><span class="ic">↗</span>Sorties<span class="badge" id="outBadge" hidden></span></button>
    <button class="tab" data-tab="lieux" aria-selected="false"><span class="ic">▣</span>Lieux</button>
    <button class="tab" data-tab="search" aria-selected="false"><span class="ic">⌕</span>Chercher</button>
  </nav>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ======================= configuration ======================= */
const ROOT = "https://raspy-sound-6175.rawadyaman7.workers.dev";
const API  = ROOT + "/api";
const RETARD = 21;      // jours dehors avant alerte rouge
const EXP_SOON = 30;    // jours avant péremption = alerte orange
const PHOTO_MAX = 1200; // côté le plus long, en pixels, après réduction

/* ======================= aides ======================= */
const $ = id => document.getElementById(id);
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const days = iso => Math.floor((Date.now()-new Date(iso).getTime())/86400000);
const daysTo = iso => Math.ceil((new Date(iso).getTime()-Date.now())/86400000);
const first = v => Array.isArray(v) ? v[0] : v;
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
const today = () => new Date().toISOString().slice(0,10);
let toastT;
function toast(msg){
  $("toast").innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(()=>$("toast").innerHTML="", 2800);
}

/* ======================= Airtable via le Worker ======================= */
async function apiGet(table){
  const out = []; let offset = null;
  do{
    const u = new URL(API + "/" + table);
    u.searchParams.set("pageSize","100");
    if(offset) u.searchParams.set("offset", offset);
    const r = await fetch(u);
    if(!r.ok) throw new Error(table + " : " + r.status);
    const j = await r.json();
    out.push(...(j.records||[]));
    offset = j.offset || null;
  } while(offset);
  return out;
}
async function apiPost(table, records){
  const r = await fetch(API + "/" + table, { method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({records, typecast:true}) });
  if(!r.ok) throw new Error(await r.text());
  return (await r.json()).records;
}
async function apiPatch(table, records){
  const r = await fetch(API + "/" + table, { method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({records, typecast:true}) });
  if(!r.ok) throw new Error(await r.text());
  return (await r.json()).records;
}
async function apiAuth(code){
  const r = await fetch(ROOT + "/auth", { method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({code}) });
  if(!r.ok) throw new Error("Vérification impossible");
  return r.json();
}
async function apiUpload(table, recordId, dataUrl, filename){
  const m = /^data:(image\/[a-z]+);base64,(.*)$/.exec(dataUrl);
  if(!m) throw new Error("Image illisible");
  const r = await fetch(ROOT + "/upload", { method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({table, recordId, contentType:m[1], file:m[2], filename}) });
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "Envoi refusé");
  return r.json();
}
/* réduit la photo dans le navigateur : un téléphone produit 5 Mo, on envoie ~250 Ko */
function shrink(file){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let {width:w, height:h} = img;
      const k = Math.min(1, PHOTO_MAX/Math.max(w,h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Image illisible")); };
    img.src = url;
  });
}

/* ======================= état ======================= */
const DB = { unites:[], cats:[], objets:[], conso:[], personnes:[], mvts:[], lieux:[], sorties:[] };
const IX = { unite:{}, cat:{}, objet:{}, personne:{}, lieu:{}, sortie:{} };
const S = {
  tab:"home", ctx:null, cat:null, lieu:null, sortie:null,
  pick:null, sel:new Set(), q:"", me:null, pov:null, interval:25,
  loading:true, error:null
};
const LS = "local-intendance-v3";
try{ const r = localStorage.getItem(LS); if(r) S.me = JSON.parse(r); }catch(e){}
try{ const i = localStorage.getItem(LS+"-int"); if(i) S.interval = +i; }catch(e){}

const isAdmin = () => !S.pov;
const uName = id => (IX.unite[id]?.f["Nom"]) || "—";
const kids  = id => DB.unites.filter(u => first(u.f["Unité parente"]) === id && u.f["Actif"]);
const roots = () => DB.unites.filter(u => !u.f["Unité parente"] && u.f["Actif"]);
function subtree(id){ const o=[id]; for(const k of kids(id)) o.push(...subtree(k.id)); return o; }
function scopeIds(){ return S.pov ? subtree(S.pov) : DB.unites.map(u=>u.id); }
const inScope = r => arr(r.f["Unité"]).some(u => scopeIds().includes(u));

function catsFor(unitId, parentId){
  return DB.cats.filter(c=>{
    if(!c.f["Active"]) return false;
    if((first(c.f["Catégorie parente"])||null) !== (parentId||null)) return false;
    const us = arr(c.f["Unités"]);
    return us.length === 0 || us.includes(unitId);
  }).sort((a,b)=>(a.f["Ordre"]||99)-(b.f["Ordre"]||99));
}
function catOf(rec){
  const id = first(rec.f["Catégorie"]);
  if(id && IX.cat[id]) return IX.cat[id];
  const t = rec.f["Catégorie (texte, remplacé)"];
  return t ? DB.cats.find(c=>c.f["Nom"]===t) || null : null;
}
/* l'emplacement vient du lien ; sinon on retombe sur l'ancien texte */
function lieuOf(rec){
  const id = first(rec.f["Emplacement"]) || first(rec.f["Emplacement (lien)"]);
  if(id && IX.lieu[id]) return IX.lieu[id];
  const t = rec.f["Emplacement habituel"] || rec.f["Emplacement"];
  if(typeof t === "string" && t){
    const n = norm(t).replace(/^local\s*[—-]\s*/,"");
    return DB.lieux.find(l => norm(l.f["Nom"]) === n) || null;
  }
  return null;
}
const isShared = c => !!(c && c.f["Partagée"]);
const isLocked = c => !!(c && c.f["Verrouillée"]);
const canEdit  = c => isAdmin() || !isLocked(c);
const isConso  = r => !!IX.objet[r.id] && DB.conso.some(x=>x.id===r.id);
const tableOf  = r => DB.conso.some(x=>x.id===r.id) ? "consommables" : "objets";

function linesOf(unitId, catId){
  const out = [];
  const take = (rec)=>{
    if(rec.f["Archivé"]) return;
    const c = catOf(rec); if(!c || c.id !== catId) return;
    const us = arr(rec.f["Unité"]);
    if(isShared(c)){ if(us.length && !us.includes(unitId)) return; }
    else if(!us.includes(unitId)) return;
    out.push(rec);
  };
  DB.objets.forEach(take); DB.conso.forEach(take);
  return out;
}

/* quantités actuellement dehors, calculées depuis le journal */
let OUTQ = {}, OPEN = {};
function recompute(){
  const m = {};
  for(const mv of DB.mvts){
    const oid = first(mv.f["Objet"]); if(!oid) continue;
    const q = mv.f["Quantité"] || 1, t = mv.f["Type"];
    if(t === "Sortie") m[oid] = (m[oid]||0) + q;
    else if(t === "Retour" || t === "Perte déclarée" || t === "Casse déclarée")
      m[oid] = (m[oid]||0) - q;
  }
  for(const k in m) if(m[k] <= 0) delete m[k];
  OUTQ = m;
  const open = {};
  for(const mv of DB.mvts){
    if(mv.f["Type"] !== "Sortie") continue;
    const oid = first(mv.f["Objet"]); if(!oid || !OUTQ[oid]) continue;
    const cur = open[oid];
    if(!cur || (mv.f["Date"]||"") > (cur.f["Date"]||"")) open[oid] = mv;
  }
  OPEN = open;
}
const dispoOf = r => Math.max(0, (r.f["Quantité"] ?? 0) - (OUTQ[r.id]||0));

/* ======================= chargement ======================= */
async function load(){
  S.loading = true; S.error = null; render();
  try{
    const [unites, cats, objets, conso, personnes, mvts, lieux, sorties] = await Promise.all([
      apiGet("unites"), apiGet("categories"), apiGet("objets"), apiGet("consommables"),
      apiGet("personnes"), apiGet("mouvements"), apiGet("emplacements"), apiGet("sorties")
    ]);
    const map = r => ({ id:r.id, f:r.fields||{} });
    DB.unites=unites.map(map); DB.cats=cats.map(map); DB.objets=objets.map(map);
    DB.conso=conso.map(map); DB.personnes=personnes.map(map); DB.mvts=mvts.map(map);
    DB.lieux=lieux.map(map); DB.sorties=sorties.map(map);
    IX.unite={}; DB.unites.forEach(u=>IX.unite[u.id]=u);
    IX.cat={};   DB.cats.forEach(c=>IX.cat[c.id]=c);
    IX.objet={}; DB.objets.forEach(o=>IX.objet[o.id]=o); DB.conso.forEach(o=>IX.objet[o.id]=o);
    IX.personne={}; DB.personnes.forEach(p=>IX.personne[p.id]=p);
    IX.lieu={};  DB.lieux.forEach(l=>IX.lieu[l.id]=l);
    IX.sortie={};DB.sorties.forEach(s=>IX.sortie[s.id]=s);
    recompute();
    if(S.me && S.me.role === "gerant" && !S.pov) S.pov = S.me.unite;
    if(S.pov && !S.ctx) S.ctx = S.pov;
    S.loading = false;
  }catch(e){ S.loading = false; S.error = e.message || String(e); }
  render();
}

/* ======================= rendu ======================= */
function render(){
  $("whoName").textContent = S.me ? S.me.nom : "Qui es-tu ?";
  $("whoDot").className = "dot" + (isAdmin() ? " adm" : "");
  $("povbar").innerHTML = S.pov
    ? `<div class="povbar">Vue gérant · <b>${esc(uName(S.pov))}</b></div>` : "";
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.tab === S.tab)));

  if(S.loading){ $("main").innerHTML = `<div class="spin">Chargement…</div>`; $("actions").innerHTML=""; return; }
  if(S.error){
    $("main").innerHTML = `<div class="banner err"><b>Impossible de joindre la base.</b><br>${esc(S.error)}</div>
      <button class="btn primary wide" id="retry">Réessayer</button>`;
    $("retry").onclick = load; $("actions").innerHTML=""; return;
  }
  if(!S.me){
    $("main").innerHTML = `<div class="empty" style="padding-top:70px"><div class="big">Le Local</div>
      Entre le code de ton unité pour ouvrir l'inventaire.</div>`;
    $("actions").innerHTML = `<div class="actionbar">
      <button class="btn primary wide" id="login">Entrer mon code</button></div>`;
    $("login").onclick = sheetLogin;
    if(!document.querySelector(".scrim")) sheetLogin();
    return;
  }

  const outIds = Object.keys(OUTQ).filter(id => IX.objet[id] && inScope(IX.objet[id]));
  const b = $("outBadge"); b.hidden = !outIds.length; b.textContent = outIds.length;

  if(S.pick)               return renderPicker();
  if(S.tab === "search")   return renderSearch();
  if(S.tab === "lieux")    return S.lieu ? renderLieu() : renderLieux();
  if(S.tab === "sorties")  return S.sortie ? renderSortie() : renderSorties(outIds);
  if(S.cat)                return renderCat();
  if(S.ctx)                return renderUnit();
  if(S.pov){ S.ctx = S.pov; return renderUnit(); }
  return renderHome();
}

function countsFor(unitId){
  let total=0, out=0;
  const ids = subtree(unitId);
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"]) continue;
    if(!arr(r.f["Unité"]).some(u=>ids.includes(u))) continue;
    total++; if(OUTQ[r.id]) out++;
  }
  return {total, out};
}

function renderHome(){
  $("actions").innerHTML = "";
  let total=0, out=0, late=0;
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"]) continue; total++;
    if(OUTQ[r.id]){ out++; const mv=OPEN[r.id]; if(mv && days(mv.f["Date"])>=RETARD) late++; }
  }
  $("main").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v num">${total}</div><div class="l">lignes inventoriées</div></div>
      <div class="stat out"><div class="v num">${out}</div><div class="l">sorties du local</div></div>
      <div class="stat late"><div class="v num">${late}</div><div class="l">dehors &gt; ${RETARD}j</div></div>
    </div>
    <div class="eyebrow">Le groupe</div>
    <div class="rows">${roots().map(u=>{
      const c=countsFor(u.id), k=kids(u.id).length;
      return `<button class="row ${c.total?"":"zero"}" data-go="${u.id}" data-out="${c.out?1:0}">
        <span class="row-bar"></span>
        <span class="row-main"><span class="row-name">${esc(u.f["Nom"])}</span>

          ${c.out?`<div class="row-out num">${c.out} dehors</div>`:""}</span>
        <span class="chev">›</span></button>`;}).join("")}</div>`;
  wireGo();
}

function renderUnit(){
  const u = IX.unite[S.ctx]; if(!u){ S.ctx=null; return render(); }

  $("main").innerHTML = `
    <div class="crumb">${canUp?`<button class="back" id="back">‹</button>`:""}

          <span class="row-bar"></span>

  if(bk) bk.onclick=()=>{ S.ctx = first(u.f["Unité parente"]) || (S.pov||null); render(); scrollTo(0,0); };

function catRow(cat, unitId){
  const subs = catsFor(unitId, cat.id);
  let lines = linesOf(unitId, cat.id);
  let n = lines.length, out = lines.filter(r=>OUTQ[r.id]).length;
  for(const s of subs){ const ls = linesOf(unitId, s.id); n += ls.length; out += ls.filter(r=>OUTQ[r.id]).length; }
  const badges = [isShared(cat)?`<span class="tag sh">partagé</span>`:"",
                  isLocked(cat)?`<span class="tag lk">verrouillé</span>`:""].filter(Boolean).join(" ");
  return `<button class="row ${n?"":"zero"}" data-cat="${cat.id}" data-out="${out?1:0}">
    <span class="row-bar"></span>
    <span class="row-main"><span class="row-name">${esc(cat.f["Nom"])}</span>
      <span class="row-sub">${subs.length?`${subs.length} sous-section${subs.length>1?"s":""}${badges?" · ":""}`:""}${badges}</span></span>
    <span class="row-right"><div class="row-count num">${n}</div>
      ${out?`<div class="row-out num">${out} dehors</div>`:""}</span>
    <span class="chev">›</span></button>`;
}

const bucket = (v, step) => { const lo = Math.floor(v/step)*step; return lo + "–" + (lo+step); };

function renderCat(){
  const cat = IX.cat[S.cat], u = IX.unite[S.ctx];
  if(!cat || !u){ S.cat=null; return render(); }
  const subs = catsFor(u.id, cat.id), lines = linesOf(u.id, cat.id);
  const mesure = cat.f["Mesure"] || "Aucune";
  const measured = /Longueur|Diam|Volume/.test(mesure);
  const editable = canEdit(cat);
  let body = "";
  if(subs.length) body += `<div class="eyebrow">Sous-sections</div>
    <div class="rows">${subs.map(s=>catRow(s,u.id)).join("")}</div>`;
  if(lines.length || !subs.length){
    if(subs.length) body += `<div class="eyebrow sp">Directement ici</div>`;
    if(measured) body += `<div class="seg" id="seg">
      <button data-step="10" aria-pressed="${S.interval===10}">par 10 cm</button>
      <button data-step="25" aria-pressed="${S.interval===25}">par 25 cm</button>
      <button data-step="0" aria-pressed="${S.interval===0}">tout détailler</button></div>`;
    body += lines.length ? renderLines(lines, mesure, measured)
      : `<div class="empty"><div class="big">Rien ici</div>${editable
          ? "Ajoute la première ligne avec le bouton en bas."
          : "Catégorie verrouillée — demande à l'intendant."}</div>`;
  }
  $("main").innerHTML = `
    <div class="crumb"><button class="back" id="back">‹</button>
      <div><h2>${esc(cat.f["Nom"])}</h2>
        <p>${esc(u.f["Nom"])} · ${lines.length} ligne${lines.length>1?"s":""}
        ${isShared(cat)?" · <span class='tag sh'>stock partagé</span>":""}
        ${isLocked(cat)&&!isAdmin()?" · <span class='tag lk'>lecture seule</span>":""}</p></div></div>${body}
    ${isShared(cat)?`<p class="note">Stock commun : ce que ton unité prend, l'autre le voit manquer.</p>`:""}`;
  $("back").onclick = ()=>{ S.cat = first(cat.f["Catégorie parente"]) || null; render(); scrollTo(0,0); };
  const seg = $("seg");
  if(seg) seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.interval = +b.dataset.step;
    try{ localStorage.setItem(LS+"-int", S.interval); }catch(e){}
    render(); });
  wireCat(); wireBlocks();
  $("actions").innerHTML = editable
    ? `<div class="actionbar"><button class="btn primary wide" id="add">+ Ajouter une ligne</button></div>` : "";
  const a=$("add"); if(a) a.onclick = ()=> sheetItem(null, cat);
}

function renderLines(lines, mesure, measured){
  const key = /Volume/.test(mesure) ? "Volume (L)" : "Longueur (cm)";
  const unit = /Volume/.test(mesure) ? " L" : " cm";
  if(measured && S.interval > 0){
    const g = {};
    for(const r of lines){
      const v = r.f[key];
      const k = (v==null) ? "sans mesure" : bucket(v, S.interval) + unit;
      (g[k] ||= []).push(r);
    }
    return Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0],"fr",{numeric:true}))
      .map(([k,rs])=>{
        const tot = rs.reduce((s,r)=>s+(r.f["Quantité"]||0),0);
        const out = rs.reduce((s,r)=>s+(OUTQ[r.id]||0),0);
        return `<div class="eyebrow sp">${esc(k)} — ${tot} pièce${tot>1?"s":""}${out?` · ${out} dehors`:""}</div>
                <div class="blocks">${rs.map(r=>blk(r)).join("")}</div>`;
      }).join("");
  }
  return `<div class="blocks">${lines.map(r=>blk(r)).join("")}</div>`;
}

/* ---------- le bloc objet ---------- */
function blk(r, opts){
  opts = opts || {};
  const f = r.f, out = OUTQ[r.id]||0, q = f["Quantité"] ?? null;
  const dispo = q!=null ? Math.max(0, q-out) : null;
  const lieu = lieuOf(r);
  const mv = OPEN[r.id];
  const photo = arr(f["Photo"])[0];
  const det = [f["Taille / détail"], f["Longueur (cm)"]!=null?f["Longueur (cm)"]+" cm":null,
               f["Volume (L)"]!=null?f["Volume (L)"]+" L":null, f["Usage"]].filter(Boolean).join(" · ");
  let pills = "";
  if(out){ const d = mv?days(mv.f["Date"]):0;
    pills += `<span class="pill ${d>=RETARD?"late":"out"}">${out} dehors${d?` · ${d}j`:""}</span>`; }
  const exp = f["Date d'expiration"];
  if(exp){ const dd = daysTo(exp);
    pills += dd<0 ? `<span class="pill exp">périmé</span>`
          : dd<=EXP_SOON ? `<span class="pill soon">expire dans ${dd}j</span>` : ""; }
  if(f["État"]==="Perdu") pills += `<span class="pill exp">perdu</span>`;
  const owner = arr(f["Unité"]).map(uName).filter(Boolean)[0];
  const foreign = opts.showUnit && owner;

  return `<div class="blk ${out?"out":""} ${f["État"]==="Perdu"?"gone":""} ${S.sel.has(r.id)?"sel":""}" data-blk="${r.id}">
    ${opts.pickable?`<div class="blk-pick" data-pick="${r.id}"><span class="cbox">✓</span></div>`:""}
    <div class="blk-body" data-open="${r.id}">
      ${photo?`<img class="blk-thumb" src="${esc(photo.thumbnails?.small?.url||photo.url)}" alt="">`:""}
      <div class="blk-txt">
        <div class="blk-name">${esc(f["Nom"]||f["Code"]||"—")}</div>
        <div class="blk-meta">${det?`<span class="code">${esc(det)}</span>`:""}
          ${foreign?`<span class="tag">${esc(owner)}</span>`:""}${pills}</div>
      </div>
      <div class="blk-qty">
        <div class="n ${out?"part":""}">${dispo!=null?dispo:"—"}</div>
        <div class="loc">${esc(lieu?lieu.f["Nom"]:"sans emplacement")}</div>
      </div>
    </div>
    ${opts.pickable?"":`<button class="blk-dots" data-dots="${r.id}" aria-label="Options">···</button>`}
  </div>`;
}

function renderSorties(outIds){

function mvtsOfSortie(sid){ return DB.mvts.filter(m=>first(m.f["Sortie"])===sid); }
function sortieState(sid){
  const ms = mvtsOfSortie(sid), pris = {}, rendus = {};
  for(const m of ms){
    const oid = first(m.f["Objet"]); if(!oid) continue;
    const q = m.f["Quantité"]||1;
    if(m.f["Type"]==="Sortie") pris[oid]=(pris[oid]||0)+q;
    else rendus[oid]=(rendus[oid]||0)+q;
  }
  let dehors = 0;
  for(const k in pris) dehors += Math.max(0, pris[k]-(rendus[k]||0));
  return {pris, rendus, dehors, nItems:Object.keys(pris).length};
}
function sortieRow(s){
  const st = sortieState(s.id);
  const d = s.f["Départ"] ? new Date(s.f["Départ"]).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}) : "";
  const statut = s.f["Statut"]||"Préparation";
  return `<button class="row" data-sortie="${s.id}" data-out="${st.dehors?1:0}">
    <span class="row-bar"></span>
    <span class="row-main"><span class="row-name">${esc(s.f["Nom"])}</span>
      <span class="row-sub">${esc(s.f["Type"]||"")}${d?" · "+d:""} · ${esc(statut)}</span></span>
    <span class="row-right"><div class="row-count num">${st.nItems}</div>
      ${st.dehors?`<div class="row-out num">${st.dehors} dehors</div>`:""}</span>
    <span class="chev">›</span></button>`;
}

function renderSortie(){
  const s = IX.sortie[S.sortie]; if(!s){ S.sortie=null; return render(); }
  const st = sortieState(s.id);
  const ids = Object.keys(st.pris);
  const encore = ids.filter(id => (st.pris[id]-(st.rendus[id]||0)) > 0);
  const rentres = ids.filter(id => (st.pris[id]-(st.rendus[id]||0)) <= 0);
  const statut = s.f["Statut"]||"Préparation";

  $("main").innerHTML = `
    <div class="crumb"><button class="back" id="back">‹</button>
      <div><h2>${esc(s.f["Nom"])}</h2>
        <p>${esc(s.f["Type"]||"")} · ${esc(statut)}${s.f["Lieu"]?" · "+esc(s.f["Lieu"]):""}
        ${s.f["Départ"]?" · départ "+new Date(s.f["Départ"]).toLocaleDateString("fr-FR"):""}</p></div></div>
    ${encore.length?`<div class="eyebrow">Encore dehors — ${st.dehors} pièce${st.dehors>1?"s":""}</div>
      <div class="blocks">${encore.map(id=>{
        const r = IX.objet[id]; if(!r) return "";
        const reste = st.pris[id]-(st.rendus[id]||0);
        return `<div class="blk out" data-blk="${id}">
          <div class="blk-body" data-open="${id}">
            <div class="blk-txt"><div class="blk-name">${esc(r.f["Nom"])}</div>
              <div class="blk-meta"><span class="code">${esc(arr(r.f["Unité"]).map(uName)[0]||"")}</span></div></div>
            <div class="blk-qty"><div class="n part">${reste}</div><div class="loc">à rendre</div></div>
          </div>
          <button class="blk-dots" data-ret="${id}" aria-label="Rendre">↩</button>
        </div>`;}).join("")}</div>`:""}
    ${rentres.length?`<div class="eyebrow sp">Rentré — ${rentres.length} ligne${rentres.length>1?"s":""}</div>
      <div class="blocks">${rentres.map(id=>{
        const r = IX.objet[id]; if(!r) return "";
        return `<div class="blk gone"><div class="blk-body">
          <div class="blk-txt"><div class="blk-name">${esc(r.f["Nom"])}</div></div>
          <div class="blk-qty"><div class="n">✓</div><div class="loc">rentré</div></div></div></div>`;}).join("")}</div>`:""}
    ${!ids.length?`<div class="empty"><div class="big">Sortie vide</div>
      Ajoute le matériel que vous emportez.</div>`:""}`;
  $("back").onclick = ()=>{ S.sortie=null; render(); scrollTo(0,0); };

  document.querySelectorAll("[data-ret]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.ret, reste = st.pris[id]-(st.rendus[id]||0);
    sheetReturn([{id, q:reste}], s.id);
  });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>sheetDots(b.dataset.open));

  $("actions").innerHTML = `<div class="actionbar">
    <button class="btn primary" id="addmat">+ Matériel</button>
    ${encore.length?`<button class="btn ghost" id="allback">Tout rendre</button>`:""}
    ${statut!=="Terminée"&&!encore.length&&ids.length?`<button class="btn ghost" id="close">Clôturer</button>`:""}
  </div>`;
  $("addmat").onclick = ()=>{ S.pick = {sortie:s.id}; S.sel.clear(); render(); scrollTo(0,0); };
  const ab=$("allback");
  if(ab) ab.onclick = ()=> sheetReturn(encore.map(id=>({id, q:st.pris[id]-(st.rendus[id]||0)})), s.id);
  const cl=$("close");
  if(cl) cl.onclick = async ()=>{
    try{ await apiPatch("sorties",[{id:s.id, fields:{Statut:"Terminée"}}]); toast("Sortie clôturée"); await load(); }
    catch(e){ toast("Échec"); }
  };
}

/* ---------- le sélecteur de matériel pour une sortie ---------- */
function renderPicker(){
  const s = IX.sortie[S.pick.sortie];
  const q = norm(S.q);
  const pool = [];
  for(const src of [DB.objets, DB.conso]) for(const r of src){
    if(r.f["Archivé"] || !inScope(r)) continue;
    if(dispoOf(r) <= 0) continue;
    if(q && !(norm(r.f["Nom"]).includes(q) || norm(r.f["Code"]).includes(q))) continue;
    pool.push(r);
  }
  const byCat = {};
  for(const r of pool){ const c = catOf(r); const k = c?c.f["Nom"]:"Sans catégorie"; (byCat[k] ||= []).push(r); }

  $("main").innerHTML = `
    <div class="crumb"><button class="back" id="back">‹</button>
      <div><h2>Que prenez-vous ?</h2><p>${esc(s?s.f["Nom"]:"")} · ${S.sel.size} sélectionné${S.sel.size>1?"s":""}</p></div></div>
    <div class="search"><span style="color:var(--faint);font-size:17px">⌕</span>
      <input id="q" type="search" placeholder="filtrer…" value="${esc(S.q)}" autocomplete="off"></div>
    ${Object.keys(byCat).length ? Object.entries(byCat).sort((a,b)=>a[0].localeCompare(b[0],"fr"))
      .map(([k,rs])=>`<div class="eyebrow sp">${esc(k)}</div>
        <div class="blocks">${rs.map(r=>blk(r,{pickable:true,showUnit:true})).join("")}</div>`).join("")
      : `<div class="empty"><div class="big">Rien de disponible</div>Tout est déjà sorti, ou le filtre est trop strict.</div>`}`;
  $("back").onclick = ()=>{ S.pick=null; S.sel.clear(); S.q=""; render(); scrollTo(0,0); };
  const inp = $("q");
  inp.oninput = ()=>{ S.q = inp.value; const p = inp.selectionStart; render();
    const n=$("q"); n.focus(); n.setSelectionRange(p,p); };
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.pick;
    S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
    render();
  });
  $("actions").innerHTML = S.sel.size ? `<div class="actionbar">
    <button class="btn ghost" id="clr">Annuler</button>
    <button class="btn primary" id="ok">Emporter (${S.sel.size})</button></div>` : "";
  const c=$("clr"); if(c) c.onclick=()=>{ S.sel.clear(); render(); };
  const o=$("ok"); if(o) o.onclick=()=> sheetTake([...S.sel], S.pick.sortie);
}

/* ======================= recherche ======================= */
function renderSearch(){
  $("actions").innerHTML = "";
  const q = norm(S.q);
  const hits = !q ? [] : [...DB.objets, ...DB.conso].filter(r=>{
    if(r.f["Archivé"] || !inScope(r)) return false;
    const c = catOf(r), l = lieuOf(r);
    return norm(r.f["Nom"]).includes(q) || norm(r.f["Code"]).includes(q)
        || norm(r.f["Usage"]).includes(q) || norm(c&&c.f["Nom"]).includes(q)
        || norm(l&&l.f["Nom"]).includes(q);
  }).slice(0,150);
  $("main").innerHTML = `
    <div class="search"><span style="color:var(--faint);font-size:17px">⌕</span>
      <input id="q" type="search" placeholder="tanjara, mal23a, mal de tête, étagère…" value="${esc(S.q)}"
             autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    ${!q?`<div class="empty"><div class="big">Cherche n'importe quoi</div>
        Nom, code, usage d'un médicament, catégorie, emplacement.${S.pov?`<br>Limité à ${esc(uName(S.pov))}.`:""}</div>`
      : hits.length?`<div class="eyebrow">${hits.length} résultat${hits.length>1?"s":""}</div>
          <div class="blocks">${hits.map(r=>blk(r,{showUnit:true})).join("")}</div>`
      : `<div class="empty"><div class="big">Rien pour « ${esc(S.q)} »</div>Essaie une autre orthographe.</div>`}`;
  const i = $("q");
  i.oninput = ()=>{ S.q=i.value; const p=i.selectionStart; render();
    const n=$("q"); n.focus(); n.setSelectionRange(p,p); };
  wireBlocks();
}

function closeSheet(){ $("modal").innerHTML=""; }
function openSheet(html){
  $("modal").innerHTML = `<div class="scrim" id="scrim"><div class="sheet">${html}</div></div>`;

function sheetLogin(){
  openSheet(`<h3>Code d'accès</h3>
    <p class="lede">Le code de ton unité. Demande-le à l'intendant du groupe.</p>
    <div class="field"><label for="cd">Code</label>
      <input id="cd" type="text" placeholder="CEN-0000" autocapitalize="characters"
             autocomplete="off" spellcheck="false" style="font-family:var(--mono);letter-spacing:.08em"></div>
    <div class="field"><label for="nm">Ton prénom</label>
      <input id="nm" type="text" placeholder="Rawad" autocomplete="given-name"></div>
    <div id="loginErr"></div>
    <button class="btn primary wide" id="ok">Entrer</button>`);
  const go = async ()=>{
    const code=$("cd").value.trim(), nom=$("nm").value.trim();
    if(!code) return $("cd").focus();
    if(!nom) return $("nm").focus();
    const btn=$("ok"); btn.disabled=true; btn.textContent="Vérification…";
    let res; try{ res = await apiAuth(code); }catch(e){ res={ok:false,reason:"Serveur injoignable"}; }
    if(!res.ok){ btn.disabled=false; btn.textContent="Entrer";
      $("loginErr").innerHTML=`<div class="banner err">${esc(res.reason||"Code refusé")}</div>`; return; }
    let p = DB.personnes.find(x=>norm(x.f["Nom"])===norm(nom));
    if(!p){ try{
      const [rec] = await apiPost("personnes",[{fields:{Nom:nom,"Unité":[res.unitId],Actif:true,
        "Rôle": res.role==="intendant"?"Intendant de groupe":"Gérant d'unité"}}]);
      p={id:rec.id,f:rec.fields}; DB.personnes.push(p); IX.personne[p.id]=p;
    }catch(e){} }
    S.me={nom, unite:res.unitId, role:res.role, pid:p?p.id:null};
    try{ localStorage.setItem(LS, JSON.stringify(S.me)); }catch(e){}
    S.pov = res.role==="gerant" ? res.unitId : null;
    S.ctx = S.pov; S.cat=null; closeSheet();
    DB.unites.length ? render() : load();
  };
  $("ok").onclick = go;
  $("cd").onkeydown = e=>{ if(e.key==="Enter") $("nm").focus(); };
  $("nm").onkeydown = e=>{ if(e.key==="Enter") go(); };
  setTimeout(()=>$("cd").focus(), 50);
}

function sheetWho(){
  if(!S.me) return sheetLogin();
  openSheet(`<h3>${esc(S.me.nom)}</h3>
    <p class="lede">${esc(uName(S.me.unite))} · ${S.me.role==="intendant"?"Intendant du groupe":"Gérant d'unité"}</p>

}

/* ---------- le menu ··· d'un objet ---------- */
function sheetDots(id){
  const r = IX.objet[id]; if(!r) return;
  const cat = catOf(r), out = OUTQ[id]||0, dispo = dispoOf(r);
  const editable = canEdit(cat);
  const photo = arr(r.f["Photo"])[0];
  const lieu = lieuOf(r);
  openSheet(`<h3>${esc(r.f["Nom"])}</h3>
    <p class="lede">${esc(r.f["Code"]||"")}${lieu?" · "+esc(lieu.f["Nom"]):""}
      ${out?` · ${out} dehors`:""}</p>
    ${photo?`<img class="bigphoto" src="${esc(photo.url)}" alt="">`:""}
    <div class="menu">
      ${dispo>0?`<button id="take"><span class="mi">↗</span><span>Je prends
        <span class="msub">${dispo} disponible${dispo>1?"s":""}</span></span></button>`:""}
      ${out?`<button id="give"><span class="mi">↩</span><span>Je rends
        <span class="msub">${out} dehors</span></span></button>`:""}
      ${editable?`<button id="edit"><span class="mi">✎</span><span>Modifier
        <span class="msub">nom, quantité, emplacement</span></span></button>`:""}
      ${editable?`<button id="photo"><span class="mi">◉</span><span>${photo?"Changer la photo":"Prendre une photo"}</span></button>`:""}
      <button id="hist"><span class="mi">≡</span><span>Historique</span></button>
      <button id="lost" class="dgr"><span class="mi">⚠</span><span>Déclarer perdu
        <span class="msub">retiré de l'inventaire, gardé dans l'historique</span></span></button>
      ${editable?`<button id="arch" class="dgr"><span class="mi">□</span><span>Archiver</span></button>`:""}
    </div>
    <input type="file" id="pf" accept="image/*" capture="environment" hidden>`);

  const t=$("take"), g=$("give"), e=$("edit"), ph=$("photo"), h=$("hist"), l=$("lost"), a=$("arch");
  if(t) t.onclick = ()=>{ closeSheet(); sheetTake([id], null); };
  if(g) g.onclick = ()=>{ closeSheet(); sheetReturn([{id, q:out}], null); };
  if(e) e.onclick = ()=>{ closeSheet(); sheetItem(r, cat); };
  if(h) h.onclick = ()=>{ closeSheet(); sheetHist(id); };
  if(ph) ph.onclick = ()=> $("pf").click();
  const pf = $("pf");
  if(pf) pf.onchange = async ()=>{
    const f = pf.files[0]; if(!f) return;
    closeSheet(); toast("Envoi de la photo…");
    try{
      const d = await shrink(f);
      await apiUpload(tableOf(r), id, d, (r.f["Code"]||"photo")+".jpg");
      toast("Photo enregistrée"); await load();
    }catch(err){ toast(err.message || "Échec de l'envoi"); }
  };
  if(l) l.onclick = async ()=>{
    closeSheet();
    const q = out || r.f["Quantité"] || 1;
    try{
      await apiPatch(tableOf(r), [{id, fields:{"État":"Perdu"}}]).catch(()=>{});
      await apiPost("mouvements", [{fields:{Type:"Perte déclarée", Date:new Date().toISOString(),
        "Quantité":q, Objet:[id], ...(S.me.pid?{Personne:[S.me.pid]}:{}),
        Notes:"Déclaré perdu depuis l'app"}}]);
      toast("Marqué perdu"); await load();
    }catch(err){ toast("Échec"); }
  };
  if(a) a.onclick = async ()=>{
    closeSheet();
    try{ await apiPatch(tableOf(r), [{id, fields:{"Archivé":true}}]); toast("Archivé"); await load(); }
    catch(err){ toast("Échec de l'archivage"); }
  };
}

function sheetHist(id){
  const ms = DB.mvts.filter(m=>first(m.f["Objet"])===id)
    .sort((a,b)=>(b.f["Date"]||"").localeCompare(a.f["Date"]||"")).slice(0,25);
  const r = IX.objet[id];
  openSheet(`<h3>Historique</h3><p class="lede">${esc(r?r.f["Nom"]:"")}</p>
    ${ms.length?`<div class="recap" style="max-height:340px">${ms.map(m=>{
      const who = arr(m.f["Personne"]).map(p=>IX.personne[p]?.f["Nom"]).filter(Boolean)[0]||"?";
      const so = first(m.f["Sortie"]); const sn = so && IX.sortie[so] ? IX.sortie[so].f["Nom"] : "";
      const d = m.f["Date"] ? new Date(m.f["Date"]).toLocaleDateString("fr-FR") : "";
      return `<div class="ln"><span>${esc(m.f["Type"])} ×${m.f["Quantité"]||1}
        <span class="code">${esc(who)}${sn?" · "+esc(sn):""}</span></span>
        <span class="code">${esc(d)}</span></div>`;}).join("")}</div>`
    :`<div class="empty">Aucun mouvement enregistré.</div>`}
    <button class="btn primary wide" id="close">Fermer</button>`);
  $("close").onclick = closeSheet;
}

function sheetTake(ids, sortieId){
  const qtys = {};
  ids.forEach(id=>{ qtys[id] = Math.max(1, dispoOf(IX.objet[id])); });
  const sorties = DB.sorties.filter(s=>s.f["Statut"]!=="Terminée");
  openSheet(`<h3>Tu prends ${ids.length} ligne${ids.length>1?"s":""}</h3>
    <p class="lede">Ajuste les quantités si tu n'en prends qu'une partie.</p>
    <div class="recap">${ids.map(id=>{
      const o = IX.objet[id], max = dispoOf(o);
      return `<div class="ln"><span>${esc(o.f["Nom"])}</span>
        <input type="number" min="1" max="${max}" value="${qtys[id]}" data-q="${id}"></div>`;}).join("")}</div>
    ${sortieId?"":`<div class="field"><label for="so">Pour quelle sortie</label>
      <select id="so"><option value="">Aucune — emprunt ponctuel</option>
      ${sorties.map(s=>`<option value="${s.id}">${esc(s.f["Nom"])}</option>`).join("")}</select></div>`}
    <div class="two">
      <div class="field"><label for="due">Retour prévu</label><input id="due" type="date"></div>
      <div class="field"><label for="chez">Où ça part</label>
        <input id="chez" type="text" placeholder="chez Jad, au camp…"></div>
    </div>
    <button class="btn primary wide" id="ok">Confirmer</button>`);
  $("ok").onclick = async ()=>{
    document.querySelectorAll("[data-q]").forEach(i=>{ qtys[i.dataset.q] = Math.max(1, +i.value||1); });
    const so = sortieId || ($("so") ? $("so").value : "");
    const due = $("due").value, chez = $("chez").value.trim();
    closeSheet();
    const recs = ids.map(id=>{
      const owner = arr(IX.objet[id].f["Unité"]);
      const emprunt = S.me && !owner.includes(S.me.unite) && owner.length;
      return { fields:{ Type:"Sortie", Date:new Date().toISOString(), "Quantité":qtys[id],
        Objet:[id], ...(S.me.pid?{Personne:[S.me.pid]}:{}), "Unité emprunteuse":[S.me.unite],
        ...(so?{Sortie:[so]}:{}), ...(due?{"Retour prévu":due}:{}), ...(chez?{"Chez qui":chez}:{}),
        ...(emprunt?{"Statut emprunt":"Sans réponse"}:{}) } };
    });
    await commit(recs, "Sortie enregistrée");
    S.pick = null; S.sel.clear(); S.q = "";
    if(so){ S.tab="sorties"; S.sortie=so; }
  };
}

    try{
      if(isNew){ f.Active = true; f.Ordre = 50; await apiPost("emplacements",[{fields:f}]); toast("Emplacement ajouté"); }
      else { await apiPatch("emplacements",[{id:l.id, fields:f}]); toast("Enregistré"); }
      await load();
    }catch(e){ toast("Échec de l'enregistrement"); }
  };
}

function sheetItem(o, cat){
  const isNew = !o;
  const mesure = cat ? (cat.f["Mesure"]||"Aucune") : "Aucune";
  const conso = cat && cat.f["Type de contenu"] === "Consommables";
  const table = o ? tableOf(o) : (conso ? "consommables" : "objets");
  const curLieu = o ? lieuOf(o) : null;
  const lieux = DB.lieux.filter(x=>x.f["Active"]!==false)
    .sort((a,b)=>(a.f["Ordre"]||99)-(b.f["Ordre"]||99));
  openSheet(`<h3>${isNew?"Nouvelle ligne":"Modifier"}</h3>
    <p class="lede">${esc(cat?cat.f["Nom"]:"")}${cat&&isShared(cat)?" · stock partagé":""}</p>
    <div class="field"><label for="nm">Nom</label>
      <input id="nm" type="text" value="${esc(o?o.f["Nom"]:"")}" placeholder="tanjara medium"></div>
    <div class="two">
      <div class="field"><label for="qt">Quantité</label>
        <input id="qt" type="number" min="0" value="${o&&o.f["Quantité"]!=null?o.f["Quantité"]:1}"></div>
      ${/Longueur|Diam/.test(mesure)?`<div class="field"><label for="ln">${esc(mesure)}</label>
        <input id="ln" type="number" step="0.1" value="${o&&o.f["Longueur (cm)"]!=null?o.f["Longueur (cm)"]:""}"></div>`
      : /Volume/.test(mesure)?`<div class="field"><label for="vl">Volume (L)</label>
        <input id="vl" type="number" step="0.1" value="${o&&o.f["Volume (L)"]!=null?o.f["Volume (L)"]:""}"></div>`
      :`<div class="field"><label for="tl">Taille / détail</label>
        <input id="tl" type="text" value="${esc(o?o.f["Taille / détail"]:"")}" placeholder="kbire, grande…"></div>`}
    </div>
    <div class="field"><label for="lc">Emplacement</label>
      <select id="lc"><option value="">— non précisé —</option>
      ${lieux.map(x=>`<option value="${x.id}" ${curLieu&&curLieu.id===x.id?"selected":""}>${esc(x.f["Nom"])}</option>`).join("")}</select></div>
    ${conso?`<div class="two">
      <div class="field"><label for="us">Usage</label>
        <input id="us" type="text" value="${esc(o?o.f["Usage"]:"")}" placeholder="mal de tête"></div>
      <div class="field"><label for="ex">Expiration</label>
        <input id="ex" type="date" value="${esc(o&&o.f["Date d'expiration"]?o.f["Date d'expiration"]:"")}"></div>
    </div>`:""}
    <button class="btn primary wide" id="ok">${isNew?"Ajouter":"Enregistrer"}</button>`);
  $("ok").onclick = async ()=>{
    const nom = $("nm").value.trim(); if(!nom) return $("nm").focus();
    const f = { Nom:nom, "Quantité": +$("qt").value || 0 };
    if($("ln") && $("ln").value!=="") f["Longueur (cm)"] = +$("ln").value;
    if($("vl") && $("vl").value!=="") f["Volume (L)"] = +$("vl").value;
    if($("tl")) f["Taille / détail"] = $("tl").value.trim();
    if($("us")) f["Usage"] = $("us").value.trim();
    if($("ex") && $("ex").value) f["Date d'expiration"] = $("ex").value;
    const lc = $("lc").value;
    f[table==="consommables" ? "Emplacement (lien)" : "Emplacement"] = lc ? [lc] : [];
    closeSheet();
    try{
      if(isNew){
        f["Unité"] = isShared(cat) ? arr(cat.f["Unités"]) : [S.ctx];
        f["Catégorie"] = [cat.id];
        f["Code"] = codeFor(cat);
        if(table==="objets") f["État"] = "Bon";
        await apiPost(table, [{fields:f}]); toast("Ligne ajoutée");
      }else{
        await apiPatch(table, [{id:o.id, fields:f}]); toast("Enregistré");
      }
      await load();
    }catch(e){ toast("Échec de l'enregistrement"); }
  };
}
function codeFor(cat){
  const u = IX.unite[S.ctx];
  const uc = (u && u.f["Code"]) || "XXX";
  const cc = norm(cat.f["Nom"]).replace(/[^a-z]/g,"").slice(0,3).toUpperCase() || "GEN";
  const n = [...DB.objets, ...DB.conso].filter(r=>(r.f["Code"]||"").startsWith(`${uc}-${cc}-`)).length + 1;
  return `${uc}-${cc}-${String(n).padStart(2,"0")}`;
}

async function commit(records, okMsg){
  try{
    for(let i=0;i<records.length;i+=10) await apiPost("mouvements", records.slice(i,i+10));
    toast(okMsg); await load();
  }catch(e){ toast("Échec : " + (e.message||"")); }
}

/* ======================= câblage ======================= */
function wireGo(){ document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
  S.ctx=b.dataset.go; S.cat=null; render(); scrollTo(0,0); }); }
function wireCat(){ document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
  S.cat=b.dataset.cat; render(); scrollTo(0,0); }); }
function wireBlocks(){
  document.querySelectorAll("[data-dots]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); sheetDots(b.dataset.dots); });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>sheetDots(b.dataset.open));
}

$("whoBtn").onclick = sheetWho;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  S.tab=t.dataset.tab; S.pick=null; S.sel.clear(); S.q="";
  if(t.dataset.tab==="home"){ S.ctx=S.pov; S.cat=null; }
  if(t.dataset.tab==="lieux") S.lieu=null;
  if(t.dataset.tab==="sorties") S.sortie=null;
  render(); scrollTo(0,0); });

load();
</script>
</body>
</html>
